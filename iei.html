<!DOCTYPE html>
<!-- 小禾的 LIFF 表單：一頁捲到底（他 2026-10-14 選甲：能一次完成不分兩次、一個動作不分兩個、一頁搞定不分兩頁）。
     上 → 下：客戶／日期／移工（從今天行程預填）→ App 的服務大項／細項（自動對到 IEI 服務項目，可改）→ 處理經過／結果片語
     → 預覽（移工語言，跟羽禾 App 同一套 Google 翻譯，＝送進 IEI 的那一份）→ 簽名格（也可一個 QR 大家掃）
     → 底部一顆「送出到 IEI（N 個簽名）」＝ Create ＋ 先簽好的簽名一起補進去。送出後同一頁繼續補簽（QR 14 天內有效），
     同一顆按鈕變「送簽核到 IEI」（他 2026-10-14 批准；送了 IEI 就鎖住，不能再補簽）。
     樣式＝「01 懸浮視窗」（他 2026-10-14 選）：雲舞白底、白色圓角浮卡、欄位前面放圖示、藍→紫→紅漸層主鈕。
     移工簽名的格子與簽名板用他的語言（越／印／泰／英，固定字串，不是機器翻；qsign.html 共用的字 check.js 會比對）。
     頁面本身沒有任何資料，資料都是 LIFF 驗身分之後才跟後端拿。舊的 ?sign=<ID> 連結也開這一頁。
     ⛔ 後端網址寫死在下面（API），不從網址參數拿：不然有人做一個假連結，就能把他的 LINE 通行證送去別的地方。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>訪談紀錄表</title>
<style>
:root{--ink:#1B1C1E;--mute:#55565A;--red:#C8102E;--line:#D9D5CC;--tile:#E4E1DA;--bg:#F0EEE9;--paper:#FAF9F6;--blue:#1F4E9C;   /* 雲舞白（他 2026-10-14 選）*/
  --card:#FFFFFF;--soft:#F4F2EE;--hair:#ECE9E3;--blue2:#2F64C0;--plum:#8A4E8E;                                                  /* 01 懸浮視窗 */
  --go:linear-gradient(100deg,var(--blue) 0%,var(--blue2) 45%,var(--plum) 75%,var(--red) 100%);   /* 白字在每一段都 ≥ 5.5:1 */
  --sh:0 18px 40px rgba(60,52,40,.12),0 2px 6px rgba(60,52,40,.06);--sh1:0 2px 8px rgba(60,52,40,.10);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}
header{display:flex;align-items:center;gap:12px;padding:16px 16px 0;max-width:560px;margin:0 auto}
header div{min-width:0;display:grid}
#ttl{font-size:22px;line-height:1.3;font-weight:900;letter-spacing:-.01em;overflow-wrap:anywhere}
#sub{font-size:14px;color:var(--mute);line-height:1.5}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:var(--sh1)}
main{padding:16px 16px 190px;display:grid;gap:16px;max-width:560px;margin:0 auto}
#form,#edit{display:grid;gap:16px}
#edit.locked{pointer-events:none;opacity:.55}
.card{background:var(--card);border-radius:28px;padding:20px 16px;box-shadow:var(--sh);display:grid;gap:14px;min-width:0;animation:pop .24s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.sh{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;line-height:1.3}
.sh .ic{color:var(--blue)}
.sh .sp{flex:1}
.f{display:grid;gap:8px;min-width:0}
.lab{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--mute)}
.fld{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--mute);min-width:0;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.fld:focus-within{border-color:var(--blue2);box-shadow:0 0 0 4px rgba(47,100,192,.14);color:var(--blue)}
.fld input,.fld textarea{flex:1;min-width:0;width:100%;border:0;outline:none;background:none;font:500 16px/1.5 inherit;font-family:inherit;color:var(--ink);padding:0;border-radius:0}
.fld textarea{padding:12px 0;min-height:76px;resize:vertical}
.fld.ta{align-items:flex-start}.fld.ta>.ic{margin-top:14px}
.fld.vt{gap:6px;padding:0 12px;font-size:15px;color:var(--mute)}
.fld.vt input{text-align:center}
.two{display:grid;grid-template-columns:1fr 116px;gap:8px}
.row2{display:grid;grid-template-columns:1fr 50px;gap:8px}
.ib{width:50px;height:50px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);color:var(--blue);display:grid;place-items:center}
.seg{display:flex;background:var(--soft);border-radius:18px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;min-height:44px;border:0;border-radius:14px;background:transparent;color:var(--mute);display:flex;gap:6px;align-items:center;justify-content:center;font:700 14px/1.2 inherit;font-family:inherit;padding:0 4px;transition:background-color .18s var(--ease),color .18s,box-shadow .18s}
.seg button[aria-pressed=true]{background:var(--card);color:var(--blue);box-shadow:var(--sh1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.chips button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 14px/1.25 inherit;font-family:inherit;white-space:nowrap;box-shadow:0 1px 3px rgba(60,52,40,.06);transition:background-color .15s,border-color .15s,transform .1s}
.chips .seg.opt{flex-basis:100%;margin:-2px 0 4px}
.chips .seg.opt button{flex:1;min-width:0;padding:0 6px;border:0;border-radius:14px;background:transparent;color:var(--mute);box-shadow:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips .seg.opt button[aria-pressed=true]{background:var(--card);color:var(--blue);box-shadow:var(--sh1)}.chips .seg.opt button::before{content:none}
.stp{display:flex;align-items:center;gap:8px}.stp button{min-width:44px;min-height:44px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);font:700 20px/1 inherit;font-family:inherit}.stp b{min-width:28px;text-align:center;font-size:16px;color:var(--ink)}
.chips.ph button{border-style:dashed;font-weight:500;white-space:normal;text-align:left;border-radius:18px;padding:8px 14px}
.chips button[aria-pressed=true]{background:linear-gradient(180deg,var(--blue2),var(--blue));border-color:transparent;border-style:solid;color:#fff;box-shadow:0 6px 14px rgba(31,78,156,.28)}
.chips button[aria-pressed=true]::before{content:"✓ "}
.pill{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px/1 inherit;font-family:inherit;display:inline-flex;align-items:center;gap:8px;box-shadow:0 1px 3px rgba(60,52,40,.06)}
.pill .ic{color:var(--blue)}
.link{border:0;background:none;padding:8px 0;min-height:44px;font:inherit;font-size:15px;color:var(--blue);text-align:left;text-decoration:underline;text-underline-offset:3px}
details summary{min-height:44px;display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer;font-size:15px;color:var(--mute);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);margin-left:4px}
details[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.list{display:grid;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.list:empty{display:none}
.list label{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 14px;cursor:pointer}
.list label+label{border-top:1px solid var(--hair)}
.list input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.list small{display:block;font-size:14px;color:var(--mute)}
.note{font-size:14px;color:var(--mute)}
.note:empty{display:none}
.pv{background:var(--soft);border-radius:16px;padding:12px 16px;display:grid;gap:2px}
.pv small{font-size:14px;color:var(--mute);font-weight:700}
.pv p{margin:0 0 8px;font-size:16px;line-height:1.6}
.langs{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px}
.langs button{min-height:44px;min-width:52px;border:0;border-radius:11px;background:transparent;color:var(--mute);font:700 14px/1 inherit;font-family:inherit;padding:0 12px}
.langs button[aria-pressed=true]{background:var(--card);color:var(--blue);box-shadow:var(--sh1)}
.sacts{display:flex;gap:8px;flex-wrap:wrap}
.signs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{font:inherit;border:1.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);min-height:88px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;text-align:left;min-width:0;transition:transform .1s,background-color .3s}
.tile b{font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.tile i{font-style:normal;font-size:14px;line-height:1.3;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:14px;font-weight:700;color:var(--blue);line-height:1.3}
.tile.ok,.tile.held,.tile.dry,.tile.auto{background:var(--soft);border-color:transparent}
.tile.ok small,.tile.held small,.tile.dry small,.tile.auto small,.tile.absent small{color:var(--mute);font-weight:500}
.tile.fail small{color:var(--red)}
.tile.flash{animation:fl 1.6s ease-out}
@keyframes fl{from{background:#DCE6F6}}
pre{white-space:pre-wrap;word-break:break-all;font-size:13px;background:var(--soft);border-radius:16px;padding:12px;margin:0}
footer{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(240,238,233,0));z-index:5}
footer>div{max-width:528px;margin:0 auto;display:grid}
#msg{margin-bottom:8px;padding:10px 14px;border-radius:14px;background:var(--card);box-shadow:var(--sh1);font-size:15px}
#msg:empty{display:none}
.go{min-height:54px;border:0;border-radius:999px;color:#fff;font:700 16px/1.2 inherit;font-family:inherit;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--go);box-shadow:0 10px 22px rgba(120,60,110,.26);text-align:left;transition:transform .1s,box-shadow .15s}
.go>.ic{margin-left:auto}
.go .n{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 10px;font-size:14px;line-height:1;white-space:nowrap}
.go:disabled{background:var(--soft);color:var(--mute);box-shadow:none}
.go:disabled .n{display:none}
#go{width:100%}
#only{text-align:center;color:var(--ink)}
.chips button:active,.seg button:active,.langs button:active,.go:active,.pill:active,.tile:active,.ib:active,.x:active,.soft:active{transform:scale(.97)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bar i{display:block;height:4px;width:40%;border-radius:2px;background:var(--blue);animation:go 1.2s ease-in-out infinite}
@keyframes go{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}
.fld :focus-visible{outline:0}
/* 全螢幕簽名板（同 s.html：點格子才開，捲動時不可能畫到） */
.board{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:none;animation:fade .2s ease-out both}
@keyframes fade{from{opacity:0}}
.bhd{position:relative;padding:16px 72px 8px 20px;display:grid;gap:2px}
.bhd .eye{font-size:14px;color:var(--mute);font-weight:700}
.bhd b{font-size:28px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.bhd .zh{font-size:15px;color:var(--mute)}
.bhd .x{position:absolute;top:12px;right:16px;background:var(--card)}
.read{margin:4px 16px 0;background:var(--card);border-radius:16px;padding:0 16px;box-shadow:var(--sh1);max-height:34vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.read p{margin:0 0 10px;font-size:16px;line-height:1.55}
.read p b{display:block;font-size:14px;color:var(--mute)}
.pad{flex:1;position:relative;margin:12px 16px;background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;min-height:160px}
.pad::after{content:"";position:absolute;left:24px;right:24px;top:70%;border-top:1.5px dashed var(--line);pointer-events:none}
.pad .hint{position:absolute;left:0;right:0;top:calc(70% + 10px);text-align:center;font-size:16px;color:var(--mute);pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bft{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
.bft button{min-height:54px;border-radius:999px;font:700 15px/1.2 inherit;font-family:inherit;padding:0 8px;text-align:center}
.soft{border:0;background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.bft .go{justify-content:space-between;padding:0 16px;text-align:left}
.qbody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:grid;align-content:start;justify-items:center;gap:16px;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
#qbox{padding:12px;background:#fff;border-radius:20px;box-shadow:var(--sh)}
.qbody .fld{width:100%}
#qurl{font-size:14px;color:var(--mute)}
.ql{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:6px}
.ql li{display:flex;justify-content:space-between;gap:12px;min-height:48px;align-items:center;padding:6px 16px;background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(60,52,40,.06);font-weight:700}
.ql li span{white-space:nowrap;color:var(--blue)}
.ql li.ok span,.ql li.held span,.ql li.dry span{color:var(--mute);font-weight:500}
.ql li.flash{animation:fl 1.6s ease-out}
/* 送簽核前的提醒（不用 confirm()） */
.dim{position:fixed;inset:0;background:rgba(27,28,30,.38);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease-out both}
.sheet{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:24px 20px calc(16px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .24s var(--ease) both}
@keyframes up{from{transform:translateY(100%)}}
.sheet b{font-size:20px;font-weight:900;line-height:1.3}
.sheet p{margin:0;font-size:16px}
.sheet .warn{border-left:4px solid var(--red);padding-left:12px}
.sheet .btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px}
.sheet .btns button{min-height:54px;border-radius:999px;font:700 16px/1.2 inherit;font-family:inherit}
.sheet .soft{border:1.5px solid var(--line);box-shadow:none}
.sheet .go{justify-content:center}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bar i{width:100%}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-in" viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 1.5a11 11 0 005.5 5.5L15 14l5 2v3a2 2 0 01-2 2A15 15 0 013 6a2 2 0 012-2z"/><path d="M15 3v6h6M21 3l-6 6"/></symbol>

  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18v2M18 14h2"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
</svg>
<header>
  <button type="button" class="x" id="close" aria-label="關閉"><svg class="ic s"><use href="#i-x"/></svg></button>
  <div><b id="ttl">讀取中…</b><span id="sub">客戶訪視服務紀錄表</span></div>
</header>
<main>
 <div class="bar" id="bar"><i></i></div>
 <div id="form" hidden>
  <div id="edit">
   <section class="card">
    <div class="f" id="tripsF"><div class="lab"><svg class="ic s"><use href="#i-route"/></svg>今天的行程</div><div class="chips scroll" id="trips"></div></div>
    <div class="f">
      <div id="custNow" class="note"></div>
      <div class="list" id="cands"></div>
      <div class="row2"><label class="fld"><svg class="ic"><use href="#i-co"/></svg><input type="search" id="q" placeholder="打客戶名稱找" aria-label="打客戶名稱找"></label>

  }).catch(function (e) { say(e.message); });
};
$('q1').onclick = function () { $('qrm').hidden = true; };
/* 即時更新：有草稿、頁面看得到時每 4 秒問一次（後端只讀快取，不打 IEI）。上傳中不問，免得蓋掉「上傳中」 */
setInterval(function () {
  if (!DRAFT || !X || POLL || locked() || document.hidden || slots().some(function (p) { return ST[p.k] === 'up'; })) return;
  POLL = true;
  api({ api: 'signPoll', d: DRAFT }).then(function (j) {
    apply(Object.assign({}, X, { slots: Object.keys(j.on).map(function (k) { return { k: k, signed: j.on[k] }; }) }), true);
  }).catch(function () {}).then(function () { POLL = false; });
}, 4000);
/* ---------- 送出：一顆按鈕＝存草稿＋Create＋先簽好的簽名一起補進 IEI；送出後同一顆變「送簽核到 IEI」 ---------- */
function goSet(t, badge, aria) { $('goT').textContent = t; $('goN').textContent = badge || ''; $('goB').hidden = !badge; $('go').setAttribute('aria-label', aria || t); }
function check() {
  $('only').hidden = !SENT;
  if (SENT) {
    var n = nSigned() + '／' + slots().length + ' 已簽';
    $('go').disabled = locked();
    if (locked()) goSet('已送簽核 ✓'); else goSet('送簽核到 IEI', n, '送簽核到 IEI（' + n + '）');
    $('only').textContent = locked() ? '再傳一次留底到 LINE' : '只傳留底到 LINE，先不送簽核';
    return;
  }
  var l = $('labor').dataset.v, bad = !S.cu00 ? '先選 IEI 客戶' : !S.items.length ? '至少選一個服務項目'
    : l !== '2' && !picked().length ? '至少勾一位移工' : l !== '2' && !S.nat ? 'IEI 一張只能一個國籍' : '';
  $('go').disabled = !!bad;
  if (bad) goSet(bad); else goSet('送出到 IEI', String(nSigned()), '送出到 IEI（' + nSigned() + ' 個簽名）');
}
$('go').onclick = function () {
  if (slots().some(function (p) { return ST[p.k] === 'up'; })) return say('還有簽名在存，等一下再按');
  if (SENT) {   // 送簽核：全簽了直接送；有人沒簽先跳提醒（不用 confirm()）
    var left = unsigned();
    if (!left.length) return submit();
    $('shT').textContent = '還有 ' + left.length + ' 人沒簽'; $('shN').textContent = left.map(function (p) { return p.name; }).join('、');
    $('sheet').hidden = false; return;
  }
  $('go').disabled = true; say('送出中…（存紀錄、補簽名，約 10～30 秒）'); $('dryOut').hidden = true;
  api({ api: 'send', draft: draft() }).then(function (j) {
    if (j.dry) {
      DRAFT = j.id; say('試跑：沒有送出。下面是會送給 IEI 的內容，另外有 ' + j.held + ' 個簽名會一起補進去。');
      $('dryOut').textContent = j.form; $('dryOut').hidden = false; check(); return;
    }
    apply(j.state);
    say('已送出 ✓ IEI 編號 ' + j.svid + (j.flushed ? '，' + j.flushed + ' 個簽名已補進去' : '') + (j.fail.length ? '。沒補成：' + j.fail.join('；') : ''));
    finish();
  }).catch(function (e) { say(e.message); check(); });
};
$('shNo').onclick = function () { $('sheet').hidden = true; };
$('shGo').onclick = submit;
$('only').onclick = finish;
/* 送簽核＝IEI 的 sendSite('2')。⛔ 送了就鎖住，不能再補簽。成功後順手傳留底（卡片會顯示「已送簽核」） */
function submit() {
  $('sheet').hidden = true; $('go').disabled = true; say('送簽核中…'); $('dryOut').hidden = true;
  api({ api: 'submit', d: DRAFT }).then(function (j) {
    if (j.dry) { say('試跑：沒有送簽核。下面是會送給 IEI 的內容。'); $('dryOut').textContent = j.form; $('dryOut').hidden = false; check(); return; }
    X.locked = true; head(); drawSigns();
    say('已送簽核 ✓ IEI 編號 ' + j.svid + '（IEI 鎖住了，不能再補簽）'); finish();
  }).catch(function (e) { say(e.message); check(); });
}
/* 留底卡：替他送「送出結果」→ 小禾用 reply 回（免費）。送不出去才請後端推播（吃每月額度）。頁面不關，可以繼續補簽 */
function finish() {
  liff.sendMessages([{ type: 'text', text: '送出結果 ' + DRAFT }])
    .catch(function () { return api({ api: 'signDone', d: DRAFT }).then(function (j) { if (!j.pushed) say('留底卡之前傳過了（簽名人數沒變）'); }); })
    .catch(function (e) { say(e.message); });
}
liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) return liff.login();
  return api({ api: 'prep', d: DRAFT, date: DAY }).then(function (j) {
    META = j; $('bar').hidden = true; $('form').hidden = false;
    $('date').value = j.day; seg('method', '1'); seg('labor', '1');
    if (j.draft) { $('tripsF').hidden = true; apply(j.state); return fill(j.draft).then(function () { SAVED = JSON.stringify(Object.assign({}, draft(), { id: '' })); }); }
    $('p').value = S.autoP = '巡迴服務-關心移工'; $('a').value = S.autoA = '移工表示工作上及生活都沒有問題。';   // 他定的預設
    cats(); items(); head(); trips(j.trips); langs(); check();
  });
}).catch(function (e) { $('bar').hidden = true; $('ttl').textContent = '打不開'; say(String(e && e.message || e)); });
</script>
