<!DOCTYPE html>
<!-- 小禾的 LIFF 表單（他 2026-10-13 選乙：一張預填好的 IEI 客戶訪視服務紀錄表）。
     從今天行程預填 → 他改要改的 → 按送出：存草稿（後端 Main.gs api:'save'）→ 替他送「訪談確認 <ID>」→ 小禾回確認卡。
     這一頁不送 IEI，送 IEI 是在確認卡上按的。頁面本身沒有任何資料，資料都是 LIFF 驗身分之後才跟後端拿。
     ⛔ 後端網址寫死在下面（API），不從網址參數拿：不然有人做一個假連結，就能把他的 LINE 通行證送去別的地方。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>訪談紀錄表</title>
<style>
:root{--ink:#111111;--mute:#4A5566;--red:#E30613;--line:#D6DEEA;--tile:#F3F5F8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#fff}
header{padding:16px 16px 0;display:grid;gap:4px}
.eye{font-size:14px;color:var(--mute)}
.ttl{display:flex;gap:12px;align-items:stretch}.ttl i{width:5px;background:var(--red);flex:none}
.ttl b{font-size:22px;line-height:1.25;font-weight:700}
.rule{height:2px;background:var(--ink);margin-top:8px}
main{padding:16px 16px 112px;display:grid;gap:24px}
.f{display:grid;gap:8px}
.f>span{font-size:14px;font-weight:700;color:var(--mute)}
input[type=text],input[type=date],input[type=number],input[type=search],textarea,select{font:16px/1.5 inherit;font-family:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--ink);padding:8px 12px;min-height:44px;width:100%;border-radius:0}
textarea{min-height:72px;resize:vertical}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 112px;gap:8px}
.seg{display:flex;border:1.5px solid var(--ink)}
.seg button{flex:1;min-height:44px;border:0;background:#fff;color:var(--ink);font:700 15px/1.2 inherit;font-family:inherit;padding:4px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:700 15px/1.2 inherit;font-family:inherit;padding:4px 12px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{min-height:44px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);font:700 15px/1.2 inherit;font-family:inherit}
.chips button[aria-pressed=true]::before{content:"✓ "}
details summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.list{display:grid;gap:0;background:var(--tile)}
.list label{display:flex;gap:12px;align-items:center;min-height:52px;padding:8px 12px;border-bottom:1px solid #fff}
.list input{width:24px;height:24px;accent-color:var(--ink);flex:none}
.list small{display:block;font-size:14px;color:var(--mute)}
.note{font-size:14px;color:var(--mute)}
.warn{font-size:15px;color:var(--ink);border-left:5px solid var(--red);padding:4px 12px;background:var(--tile)}
.row{display:flex;gap:12px;align-items:center;min-height:44px}
.row input{width:24px;height:24px;accent-color:var(--ink)}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:0 0 env(safe-area-inset-bottom)}
#go{width:100%;min-height:56px;border:0;background:var(--ink);color:#fff;font:700 17px/1 inherit;font-family:inherit;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
#go em{color:var(--red);font-style:normal;font-size:20px}
#go:disabled{background:var(--mute)}
#msg{padding:8px 16px;font-size:15px;min-height:0}
#msg:empty{display:none}
.bar{height:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:4px;width:40%;background:var(--ink);animation:go 1.2s ease-in-out infinite}
@keyframes go{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
[hidden]{display:none!important}
/* 簽名頁（?sign=）：名單一格一人，點了才開全螢幕簽名板，捲動時不可能畫到（同 s.html） */
#hub{padding:16px 16px 112px;display:grid;gap:16px}
.ppl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.p{display:flex;background:var(--tile)}
.p.todo,.p.fail{box-shadow:inset 5px 0 0 var(--ink)}
.pm{flex:1;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border:0;background:none;text-align:left;font:inherit;color:var(--ink)}
.pm .nm{flex:1;font-weight:700;font-size:17px;line-height:1.35}
.pm small{display:block;font-size:14px;font-weight:400;color:var(--mute)}
.pm .st{font-size:15px;font-weight:700;white-space:nowrap}
.p.ok .st,.p.dry .st,.p.absent .st{color:var(--mute);font-weight:400}
.p.flash,.ql li.flash{animation:fl 1.6s ease-out}
@keyframes fl{from{background:var(--line)}}
@media (prefers-reduced-motion:reduce){.p.flash,.ql li.flash{animation:none}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.board{position:fixed;inset:0;background:#fff;z-index:9;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:none}
.bhd{position:relative;padding:16px 16px 8px;border-bottom:2px solid var(--ink);display:grid;gap:4px}
.bhd b{font-size:28px;line-height:1.2;padding-right:56px}
.bhd .say{font-size:20px;font-weight:700}
.bhd .x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;font:700 22px/1 inherit;font-family:inherit;color:var(--ink)}
#cv{flex:1;width:100%;display:block;background:#fff linear-gradient(var(--ink),var(--ink)) 24px 70%/calc(100% - 48px) 1px no-repeat}
.qbody{flex:1;overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;justify-items:center;gap:16px;padding:16px}
#qbox{padding:8px;background:#fff}
#qurl{font-size:14px;min-height:44px;color:var(--mute)}
.ql{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:4px}
.ql li{display:flex;justify-content:space-between;gap:12px;min-height:44px;align-items:center;padding:4px 12px;background:var(--tile);font-weight:700}
.ql li span{white-space:nowrap}
.ql li.ok span,.ql li.dry span{color:var(--mute);font-weight:400}
.bft{display:grid;grid-template-columns:1fr 1fr 2fr;border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
.bft button{min-height:56px;font:700 16px/1 inherit;font-family:inherit;border:0;background:#fff;color:var(--ink)}
.bft button+button{border-left:1.5px solid var(--ink)}
.bft .go{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.bft .go em{color:var(--red);font-style:normal;font-size:20px}
</style></head><body>
<header>
  <div class="eye" id="eye">客戶訪視服務紀錄表</div>
  <div class="ttl"><i></i><b id="ttl">讀取中…</b></div>
  <div class="eye" id="sub"></div>
  <div class="rule"></div>
</header>
<div class="bar" id="bar"><i></i></div>
<main id="form" hidden>
  <div class="f" id="tripsF"><span>今天的行程（點一站就帶入）</span><div class="chips" id="trips"></div></div>

  <div class="f"><span>IEI 客戶</span>
    <div id="custNow" class="note"></div>
    <div class="list" id="cands"></div>
    <div class="two"><input type="search" id="q" placeholder="打客戶名稱找"><button type="button" class="btn" id="qGo">找</button></div>
  </div>
  <label class="f"><span>服務地址</span><input type="text" id="addr"></label>
  <div class="two">
    <label class="f"><span>服務日期</span><input type="date" id="date"></label>
    <label class="f"><span>第幾次訪視</span><input type="number" id="vt" min="1" step="1" inputmode="numeric"></label>
  </div>

  <div class="f"><span>服務方式</span><div class="seg" id="method" data-v="1">
    <button type="button" data-v="1">親自拜訪</button><button type="button" data-v="2">電話</button><button type="button" data-v="3">來電</button><button type="button" data-v="4">書信</button></div></div>
  <div class="f"><span>服務對象</span><div class="seg" id="labor" data-v="1">
    <button type="button" data-v="1">雇主與外國人</button><button type="button" data-v="2">雇主</button><button type="button" data-v="3">外國人</button></div></div>

  <div class="f" id="wkF"><span>移工（IEI 名單，行程上的人已勾好）</span>
    <div class="list" id="wk"><div class="note" style="padding:12px">先選客戶</div></div>
    <div id="natNote" class="note"></div></div>

  <div class="f"><span>服務項目</span>
    <div class="chips" id="itemsTop"></div>
    <details><summary>其他項目 ▾</summary><div class="chips" id="itemsMore"></div></details></div>

  <div class="f" id="cuF"><span>雇主處理經過</span><select id="cuPs"></select><textarea id="cuP"></textarea>
    <span>雇主處理結果</span><select id="cuAs"></select><textarea id="cuA"></textarea></div>

  <div class="f" id="laF"><span>移工處理經過／結果</span>
    <label class="row"><input type="checkbox" id="same" checked>同雇主</label>
    <div id="laBox" class="f" hidden><select id="laPs"></select><textarea id="laP" placeholder="移工處理經過"></textarea>
      <select id="laAs"></select><textarea id="laA" placeholder="移工處理結果"></textarea>
      <div class="note">不是片語的字，送出時用 IEI 自己的翻譯功能翻成移工的語言。</div></div></div>

  <label class="f"><span>後續追蹤處理紀錄（選填）</span><textarea id="after"></textarea></label>
</main>
<section id="hub" hidden>
  <ul class="ppl" id="ppl"></ul>
  <div class="acts"><button type="button" class="btn" id="qrAll">QR 給大家掃</button><button type="button" class="btn" id="reload">重新整理</button><button type="button" class="btn" id="done">完成</button></div>
  <div class="note" id="hubNote"></div>
</section>
<div class="board" id="board" hidden>
  <div class="bhd"><span class="eye" id="brole"></span><b id="bwho"></b><span class="say" id="bsay"></span><span class="eye">請在這裡簽名</span>
    <button type="button" class="x" id="bx" aria-label="結束"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <canvas id="cv"></canvas>
  <div class="bft"><button type="button" id="b1"></button><button type="button" id="b2"></button><button type="button" class="go" id="b3">簽好了<em>→</em></button></div>
</div>
<div class="board" id="qrm" hidden>
  <div class="bhd"><span class="eye">一個 QR 大家掃，用自己的手機簽</span><b id="qwho"></b><span class="eye">誰簽了下面會馬上打勾</span></div>
  <div class="qbody"><div id="qbox"></div><input type="text" id="qurl" readonly aria-label="簽名連結"><ul class="ql" id="qppl"></ul></div>
  <div class="bft" style="grid-template-columns:1fr"><button type="button" id="q1">關閉</button></div>
</div>
<footer><div id="msg" role="status"></div><button id="go" disabled>確認後送出<em>→</em></button></footer>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyZDD8YqjQ7_lBzyNyILy3jJfFsIWlVtz_ouhPJxakT7ka6F4Ou2sYn2khQiJmXY3U/exec';
var Q = new URLSearchParams(location.search), Q2 = new URLSearchParams(decodeURIComponent(Q.get('liff.state') || '').replace(/^\?/, ''));
function qp(k) { return Q.get(k) || Q2.get(k) || ''; }
var LIFF_ID = qp('liff'), DRAFT = qp('d');
var S = { items: [], picks: {}, workers: [], vtEdited: false, trip: null, cu00: '', cuName: '', client: '' }, META = null;
function $(id) { return document.getElementById(id); }
function say(t) { $('msg').textContent = t || ''; }
function el(tag, txt, attrs) { var e = document.createElement(tag); if (txt != null) e.textContent = txt; for (var k in attrs || {}) e.setAttribute(k, attrs[k]); return e; }
function api(o) {
  o.at = liff.getAccessToken();
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o) })   // text/plain：避開預檢
    .then(function (r) { return r.json(); })
    .then(function (j) { if (j.ok === false) throw new Error(j.err); return j; });
}
function seg(id, v) { var b = $(id); if (v != null) b.dataset.v = String(v); [].forEach.call(b.children, function (x) { x.setAttribute('aria-pressed', String(x.dataset.v === b.dataset.v)); }); }
['method', 'labor'].forEach(function (id) {
  $(id).addEventListener('click', function (e) { var x = e.target.closest('button'); if (!x) return; seg(id, x.dataset.v); sides(); check(); });
});
function sides() { var l = $('labor').dataset.v; $('cuF').hidden = l === '3'; $('laF').hidden = $('wkF').hidden = l === '2'; check(); }
$('same').onchange = function () { $('laBox').hidden = $('same').checked; };
/* 片語下拉：跟 IEI 一樣，選了就接在後面（逗號隔開） */
function phrases(selId, boxId, list) {
  var s = $(selId); s.innerHTML = ''; s.appendChild(el('option', '＋ 加一句片語', { value: '' }));
  list.forEach(function (t) { s.appendChild(el('option', t, { value: t })); });
  s.onchange = function () { if (!s.value) return; var b = $(boxId); b.value = b.value ? b.value + ',' + s.value : s.value; s.value = ''; };
}
function items() {
  var top = $('itemsTop'), more = $('itemsMore'), pin = [9, 7, 15, 19];
  top.innerHTML = more.innerHTML = '';
  META.items.forEach(function (name, i) {
    var no = i + 1, b = el('button', no + ' ' + name, { type: 'button', 'aria-pressed': String(S.items.indexOf(no) !== -1) });
    b.onclick = function () { var k = S.items.indexOf(no); if (k === -1) S.items.push(no); else S.items.splice(k, 1); b.setAttribute('aria-pressed', String(k === -1)); check(); };
    (pin.indexOf(no) !== -1 || S.items.indexOf(no) !== -1 ? top : more).appendChild(b);
  });
}
function head() {
  $('ttl').textContent = S.cuName || S.client || '選一個客戶';
  $('sub').textContent = [$('date').value, S.trip && S.trip.slot, META && META.dry ? '試跑中：按送出也不會進 IEI' : ''].filter(Boolean).join('・');
}
/* ---------- 客戶與移工 ---------- */
function cands(list) {
  var box = $('cands'); box.innerHTML = '';
  if (!list.length) { $('custNow').textContent = S.client ? 'IEI 找不到「' + S.client + '」，請在下面打名稱找' : ''; return; }
  $('custNow').textContent = 'IEI 有 ' + list.length + ' 家像的，請點一家：';
  list.forEach(function (c) {
    var lab = el('label'), r = el('input', null, { type: 'radio', name: 'cu' }), t = el('span', c.name);
    t.appendChild(el('small', c.cu00 + '・' + (c.addr || '沒有地址')));
    r.onchange = function () { pickCust(c); };
    lab.appendChild(r); lab.appendChild(t); box.appendChild(lab);
  });
}
function pickCust(c, keepPicks) {
  S.cu00 = c.cu00; S.cuName = c.name;
  if (!$('addr').value && c.addr) $('addr').value = c.addr;
  $('cands').innerHTML = ''; $('custNow').textContent = '✓ ' + c.name + '（' + c.cu00 + '）';
  head(); say('讀 IEI 移工名單…');
  return api({ api: 'iei', cu00: c.cu00, workers: S.trip ? S.trip.workers : [] }).then(function (j) { workers(j.workers, keepPicks); say(''); }).catch(function (e) { say(e.message); });
}
function workers(rows, keepPicks) {
  S.workers = rows; if (!keepPicks) { S.picks = {}; rows.forEach(function (w) { if (w.pick) S.picks[w.la00] = 1; }); }
  var box = $('wk'); box.innerHTML = '';
  if (!rows.length) box.appendChild(el('div', 'IEI 這家客戶沒有聘僱中的移工', { class: 'note', style: 'padding:12px' }));
  rows.forEach(function (w) {
    var lab = el('label'), c = el('input', null, { type: 'checkbox' }), t = el('span', w.zh || w.en);
    c.checked = !!S.picks[w.la00];
    t.appendChild(el('small', [w.zh ? w.en : '', w.nat, w.la21 ? '接管 ' + w.la21 : ''].filter(Boolean).join('・')));
    c.onchange = function () { if (c.checked) S.picks[w.la00] = 1; else delete S.picks[w.la00]; natVt(); check(); };
    lab.appendChild(c); lab.appendChild(t); box.appendChild(lab);
  });
  natVt(); check();
}
function picked() { return S.workers.filter(function (w) { return S.picks[w.la00]; }); }
/* 國籍＝勾的人的國籍（IEI 一張只能一個）。第幾次＝IEI 自己的算法：接管日到服務日每 60 天一次，1～6，取最小。 */
function natVt() {
  var p = picked(), nats = p.map(function (w) { return w.nat; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
  S.nat = nats.length === 1 ? nats[0] : '';
  $('natNote').textContent = nats.length > 1 ? '⚠ IEI 一張只能一個國籍，現在勾到 ' + nats.join('、') + '，請分開送' : (S.nat ? '國籍：' + S.nat : '');
  if (S.vtEdited) return;
  var d = new Date($('date').value), best = null;
  p.forEach(function (w) { var t = Math.round((d - new Date(w.la21)) / 864e5); if (isNaN(t)) return; var v = Math.min(6, Math.max(1, Math.ceil(t / 60))); if (best === null || v < best) best = v; });
  if (best !== null) $('vt').value = best;
}
$('vt').oninput = function () { S.vtEdited = true; };
$('date').onchange = function () { natVt(); head(); };
$('qGo').onclick = function () {
  var q = $('q').value.trim(); if (!q) return;
  say('在 IEI 找…');
  api({ api: 'iei', q: q }).then(function (j) { cands(j.cands); say(j.cands.length ? '' : '找不到，換個字試試'); }).catch(function (e) { say(e.message); });
};
/* ---------- 行程 ---------- */
function trips(list) {
  var box = $('trips'); box.innerHTML = '';
  $('tripsF').hidden = !list.length;
  list.forEach(function (t, i) {
    var b = el('button', (t.slot ? t.slot + ' ' : '') + t.client, { type: 'button', 'aria-pressed': 'false' });
    b.onclick = function () { [].forEach.call(box.children, function (x) { x.setAttribute('aria-pressed', 'false'); }); b.setAttribute('aria-pressed', 'true'); useTrip(t); };
    box.appendChild(b);
    if (i === 0) b.click();
  });
}
function useTrip(t) {
  S.trip = t; S.client = t.client; S.cu00 = ''; S.cuName = ''; S.items = t.items.slice(); S.vtEdited = false;
  $('addr').value = t.addr || ''; seg('method', t.method); items(); head();
  $('wk').innerHTML = ''; say('在 IEI 對客戶…');
  api({ api: 'iei', client: t.client, workers: t.workers }).then(function (j) {
    say('');
    if (j.cu00) { S.cu00 = j.cu00; S.cuName = j.cust ? j.cust.name : t.client; $('custNow').textContent = '✓ ' + S.cuName + '（' + j.cu00 + '）'; $('cands').innerHTML = '';
      if (!$('addr').value && j.cust) $('addr').value = j.cust.addr; head(); workers(j.workers); }
    else cands(j.cands);
  }).catch(function (e) { say(e.message); });
}
/* ---------- 送出 ---------- */
function check() {
  var l = $('labor').dataset.v, bad = !S.cu00 ? '先選 IEI 客戶' : !S.items.length ? '至少勾一個服務項目'
    : l !== '2' && !picked().length ? '至少勾一位移工' : l !== '2' && !S.nat ? 'IEI 一張只能一個國籍' : '';
  $('go').disabled = !!bad; $('go').firstChild.textContent = bad || '確認後送出';
}
$('go').onclick = function () {
  var p = picked(), l = $('labor').dataset.v;
  var d = { id: DRAFT || '', client: S.client, cuName: S.cuName, cu00: S.cu00, addr: $('addr').value.trim(),
    date: $('date').value, vt: $('vt').value, nat: l === '2' ? '' : S.nat, method: $('method').dataset.v, labor: l, items: S.items.slice().sort(function (a, b) { return a - b; }),
    cuP: $('cuP').value.trim(), cuA: $('cuA').value.trim(), same: $('same').checked, laP: $('laP').value.trim(), laA: $('laA').value.trim(),
    after: $('after').value.trim(), la00: l === '2' ? [] : p.map(function (w) { return w.la00; }), names: l === '2' ? [] : p.map(function (w) { return w.zh || w.en; }) };
  $('go').disabled = true; say('存草稿…');
  api({ api: 'save', draft: d }).then(function (j) {
    DRAFT = j.id;
    return liff.sendMessages([{ type: 'text', text: '訪談確認 ' + j.id }]).then(function () { liff.closeWindow(); })
      .catch(function () { say('草稿存好了。回聊天室打：訪談確認 ' + j.id); });
  }).catch(function (e) { say(e.message); check(); });
};
function fill(d) {
  S.client = d.client; S.cuName = d.cuName; S.items = d.items || []; S.vtEdited = true;
  $('addr').value = d.addr || ''; $('date').value = d.date; $('vt').value = d.vt || '';
  seg('method', d.method); seg('labor', d.labor);
  ['cuP', 'cuA', 'laP', 'laA', 'after'].forEach(function (k) { $(k).value = d[k] || ''; });
  $('same').checked = d.same !== false; $('laBox').hidden = $('same').checked;
  S.picks = {}; (d.la00 || []).forEach(function (x) { S.picks[x] = 1; });
  items(); sides();
  return pickCust({ cu00: d.cu00, name: d.cuName }, true);
}
/* ---------- 簽名頁（?sign=<紀錄ID>，2026-10-14 他選甲乙丙合併）----------
   乙：名單，點一個人開全螢幕簽名板。甲：底部「接力簽」一人一頁走完沒簽的（不在＝跳過，留著沒簽）。
   丙：一個 QR 大家掃（公開頁 qsign.html，他 2026-10-14 要「像羽禾 App 那樣」）；簽名頁開著時每 4 秒問一次，誰簽了馬上打勾。
   翻譯格：他第一次手簽，後端存起來，之後打開這頁就自動帶入。 */
var SIGN = qp('sign'), H = null, P = [], ST = {}, FL = {}, BQ = [], BI = 0, RELAY = false, POLL = false;
var SAY = { '菲律賓': 'Please sign here.', '越南': 'Vui lòng ký tên tại đây.', '印尼': 'Silakan tanda tangan di sini.', '泰國': 'กรุณาเซ็นชื่อที่นี่' };
var STX = { ok: '✓ 已簽', dry: '✓ 試跑沒上傳', todo: '未簽', absent: '不在', up: '上傳中…', fail: '沒傳上去，再簽一次' };
function hubLoad() {
  $('bar').hidden = false;
  return api({ api: 'sign', d: SIGN }).then(function (j) {
    H = j; $('bar').hidden = true; $('hub').hidden = false;
    $('ttl').textContent = j.cuName;
    $('sub').textContent = [j.date, 'IEI 編號 ' + j.svid, j.dry ? '試跑中：簽名不會上傳到 IEI' : ''].filter(Boolean).join('・');
    P = [{ k: 'lbr', role: '翻譯', name: j.me || '我', s: j.lbr }];
    if (j.labor !== '3') P.push({ k: 'cu', role: '雇主', name: j.cuName, s: j.cu });
    j.workers.forEach(function (w) { P.push({ k: 'w:' + w.svl, role: '移工', name: w.zh || w.en, sub: w.zh ? w.en : '', s: w, say: SAY[j.nat] || '' }); });
    P.forEach(function (p) { if (p.s.signed) ST[p.k] = 'ok'; else if (!ST[p.k] || ST[p.k] === 'ok') ST[p.k] = 'todo'; });   // IEI 說了算；不在／試跑／上傳中留著
    $('hubNote').textContent = j.auto || (j.lbrSaved ? '' : '你的簽名第一次要簽一次，之後每張自動帶入。');
    hubDraw();
  }).catch(function (e) { $('bar').hidden = true; say(e.message); });
}
function todo() { return P.filter(function (p) { return ST[p.k] === 'todo' || ST[p.k] === 'fail'; }); }
function hubDraw() {
  var ul = $('ppl'); ul.innerHTML = '';
  P.forEach(function (p) {
    var li = el('li', null, { class: 'p ' + ST[p.k] + (FL[p.k] ? ' flash' : '') }), b = el('button', null, { type: 'button', class: 'pm' }), nm = el('span', p.name, { class: 'nm' });
    nm.appendChild(el('small', [p.role, p.sub].filter(Boolean).join('・')));
    b.appendChild(nm); b.appendChild(el('span', p.k === 'lbr' && ST.lbr === 'todo' && !H.lbrSaved ? '第一次請簽' : STX[ST[p.k]], { class: 'st' }));
    b.onclick = function () { board([p], false); };
    li.appendChild(b);
    ul.appendChild(li);
  });
  var n = todo().length;
  $('go').disabled = false; $('go').firstChild.textContent = n ? '接力簽（剩 ' + n + ' 位）' : '完成，留底傳到 LINE';
  var ql = $('qppl'); ql.innerHTML = '';   // QR 畫面下面那份即時名單（翻譯不在 QR 上簽）
  P.forEach(function (p) {
    if (p.k === 'lbr') return;
    var li = el('li', p.name, { class: ST[p.k] + (FL[p.k] ? ' flash' : '') }); li.appendChild(el('span', STX[ST[p.k]])); ql.appendChild(li);
  });
  FL = {};
}
/* 簽名板（做法照 yuher-app/s.html：全螢幕、吃掉 touchmove、裁空白、最寬 600） */
var cv = $('cv'), cx = cv.getContext('2d'), inked = false, down = false;
function board(q, relay) { BQ = q; BI = 0; RELAY = relay; $('board').hidden = false; document.body.style.overflow = 'hidden'; page(); }
function page() {
  var p = BQ[BI], last = BI === BQ.length - 1;
  $('brole').textContent = p.role + (RELAY ? '・第 ' + (BI + 1) + '／' + BQ.length + ' 位' : '');
  $('bwho').textContent = p.name; $('bsay').textContent = p.say || '';
  $('b1').textContent = RELAY ? '不在' : '取消'; $('b2').textContent = RELAY ? '重簽' : '清除';
  $('b3').firstChild.textContent = RELAY && !last ? '下一位' : '簽好了';
  var r = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
  cx.setTransform(r, 0, 0, r, 0, 0); cx.lineWidth = 5; cx.lineCap = cx.lineJoin = 'round'; cx.strokeStyle = '#111';
  inked = false;
}
function next() { if (++BI < BQ.length) page(); else closeBoard(); }
function closeBoard() { $('board').hidden = true; document.body.style.overflow = ''; hubDraw(); }
function pt(e) { var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
cv.onpointerdown = function (e) { e.preventDefault(); down = true; cv.setPointerCapture(e.pointerId); var p = pt(e); cx.beginPath(); cx.moveTo(p[0], p[1]); };
cv.onpointermove = function (e) { if (!down) return; e.preventDefault(); var p = pt(e); cx.lineTo(p[0], p[1]); cx.stroke(); inked = true; };
cv.onpointerup = cv.onpointercancel = function () { down = false; };
/* ⛔ LINE 內建瀏覽器可以往下拉掉：pointer 的 preventDefault 擋不住，要在 touch 事件上 passive:false 才擋得住（s.html 2026-10-08 踩過） */
['touchstart', 'touchmove'].forEach(function (k) { cv.addEventListener(k, function (e) { e.preventDefault(); }, { passive: false }); });
document.addEventListener('touchmove', function (e) { if (!$('board').hidden) e.preventDefault(); }, { passive: false });
function crop() {   // 裁掉四周空白＋留一點邊，最寬 600（整張全螢幕存進去，簽名會小到看不見）
  var w = cv.width, h = cv.height, d = cx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  var pad = Math.round(Math.min(w, h) * 0.04); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  var k = Math.min(1, 600 / (x1 - x0 + 1)), o = document.createElement('canvas');
  o.width = Math.round((x1 - x0 + 1) * k); o.height = Math.round((y1 - y0 + 1) * k);
  o.getContext('2d').drawImage(cv, x0, y0, x1 - x0 + 1, y1 - y0 + 1, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}
$('b1').onclick = function () { if (RELAY) { ST[BQ[BI].k] = 'absent'; next(); } else closeBoard(); };
$('b2').onclick = function () { cx.clearRect(0, 0, cv.width, cv.height); inked = false; };
$('b3').onclick = function () {
  if (!inked) { alert(RELAY ? '還沒簽。人不在就按「不在」。' : '還沒簽'); return; }
  save(BQ[BI], crop()); next();   // 上傳在背景跑，不用等，直接換下一位
};
$('bx').onclick = closeBoard;
function save(p, png) {
  ST[p.k] = 'up'; hubDraw();
  api({ api: 'signPut', d: SIGN, k: p.k, png: png }).then(function (j) {
    ST[p.k] = j.dry ? 'dry' : 'ok';
    if (p.k === 'lbr' && !j.dry) { H.lbrSaved = true; $('hubNote').textContent = '你的簽名存好了，之後每張自動帶入。'; }
    hubDraw();
  }).catch(function (e) { ST[p.k] = 'fail'; hubDraw(); say(p.name + '：' + e.message); });
}
/* 一個 QR：網址帶這張紀錄的簽章（後端做的），移工掃了到公開頁 qsign.html 自己選名字簽 */
$('qrAll').onclick = function () {
  $('qrm').hidden = false; $('qwho').textContent = H.cuName; $('qurl').value = H.qurl; $('qbox').innerHTML = '';
  new QRCode($('qbox'), { text: H.qurl, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
};
$('q1').onclick = function () { $('qrm').hidden = true; };
/* 即時更新：簽名頁看得到的時候每 4 秒問一次（後端只讀快取，不打 IEI）。上傳中不問，免得蓋掉「上傳中」 */
setInterval(function () {
  if (!H || POLL || $('hub').hidden || document.hidden || P.some(function (p) { return ST[p.k] === 'up'; })) return;
  POLL = true;
  api({ api: 'signPoll', d: SIGN }).then(function (j) {
    var ch = false;
    P.forEach(function (p) {
      var v = j.on[p.k] === true ? 'ok' : j.on[p.k] === 'dry' ? 'dry' : '';
      if (v && ST[p.k] !== v && ST[p.k] !== 'ok') { ST[p.k] = v; FL[p.k] = 1; ch = true; }
    });
    if (ch) hubDraw();
  }).catch(function () {}).then(function () { POLL = false; });
}, 4000);
$('reload').onclick = hubLoad;
/* 完成：替他送「簽名完成」→ 小禾用 reply 回留底卡（免費）。送不出去才請後端推播（吃每月額度）。 */
function finish() {
  if (P.some(function (p) { return ST[p.k] === 'up'; })) return say('還有簽名在上傳，等一下再按');
  say('傳留底到 LINE…');
  liff.sendMessages([{ type: 'text', text: '簽名完成 ' + SIGN }]).then(function () { liff.closeWindow(); })
    .catch(function () { return api({ api: 'signDone', d: SIGN }).then(function (j) { say(j.pushed ? '留底卡已傳到 LINE' : '這張的留底之前傳過了（簽名人數沒變）'); }); })
    .catch(function (e) { say(e.message); });
}
$('done').onclick = finish;
liff.init({ liffId: LIFF_ID }).then(function () {
  if (!liff.isLoggedIn()) return liff.login();
  if (SIGN) {
    $('eye').textContent = '確認簽名';
    $('go').onclick = function () { var t = todo(); if (t.length) board(t, true); else finish(); };
    return hubLoad();
  }
  return api({ api: 'prep', d: DRAFT }).then(function (j) {
    META = j; $('bar').hidden = true; $('form').hidden = false;
    phrases('cuPs', 'cuP', j.proc); phrases('cuAs', 'cuA', j.ans); phrases('laPs', 'laP', j.proc); phrases('laAs', 'laA', j.ans);
    $('date').value = j.day; seg('method', '1'); seg('labor', '1');
    if (j.draft) { $('tripsF').hidden = true; return fill(j.draft); }
    $('cuP').value = '巡迴服務-關心移工'; $('cuA').value = '移工表示工作上及生活都沒有問題。';   // 他定的預設
    items(); head(); trips(j.trips); check();
  });
}).catch(function (e) { $('bar').hidden = true; $('ttl').textContent = '打不開'; say(String(e && e.message || e)); });
</script>
