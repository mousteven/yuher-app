<!DOCTYPE html>
<!-- 小禾的共用 QR 簽名頁（他 2026-10-14：「一個 QR 大家掃，誰簽了立即更新」，照羽禾 App 的宣導簽到 sign.html）。
     移工掃翻譯手機上的 QR → 這頁（2026-10-14 換成「20 品牌卡片」樣式，跟 iei.html 一致）：點自己的名字 → 看處理經過／結果（他的語言）→ 全螢幕簽名 → 謝謝。
     ⛔ 不用 LINE 登入（移工不是小禾的好友）。網址的 t＝<紀錄>.<到期日>.<簽章>，後端驗；服務日 +14 天後失效。
     ⛔ 後端只回名字、簽了沒、處理經過；不回 IEI 代碼、不回簽名圖。已簽的名字不能再點（防蓋掉別人的）。
     ⛔ 後端網址寫死在下面（小禾鐵則 7）。檔名 qsign.html 與參數 t 不可以改：QR 一出去就改不掉。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>簽名 · Sign</title>
<style>
:root{--ink:#0B1B33;--mute:#4A5565;--red:#E30613;--line:#D6DEEA;--bg:#EEF2F6;--blue:#0057B8;   /* 20 品牌卡片（同 iei.html，他 2026-10-14 選）*/
  --card:#FFFFFF;--soft:#F3F5F8;--arrow:#FF8A8F;
  --sh:0 8px 20px rgba(11,27,51,.08);--sh1:0 2px 8px rgba(11,27,51,.08);--ease:cubic-bezier(.2,.8,.2,1);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 "Helvetica Neue",Helvetica,Arial,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button{font-family:inherit;cursor:pointer}
header{padding:20px 16px 0;display:grid;gap:2px;max-width:560px;margin:0 auto}
.eye{font-size:14px;color:var(--mute);font-weight:700}
.ttl b{font-size:22px;line-height:1.3;font-weight:900;letter-spacing:-.01em;overflow-wrap:anywhere}
main{margin:16px auto 0;padding:20px 16px 24px;display:grid;gap:16px;max-width:528px;background:var(--card);border-radius:20px;box-shadow:var(--sh);width:calc(100% - 32px);animation:pop .24s var(--ease) both}
main:empty{display:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
h2{margin:0;font-size:20px;line-height:1.35;font-weight:900}
h2 small{display:block;font-size:14px;font-weight:500;color:var(--mute)}
.ppl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ppl button{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);text-align:left;font:inherit;color:var(--ink);box-shadow:var(--sh1)}
.ppl b{flex:1;font-size:18px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.ppl b small{display:block;font-size:14px;font-weight:500;color:var(--mute)}
.ppl em{font-style:normal;font-weight:700;font-size:20px;color:var(--blue);white-space:nowrap}
.ppl button:disabled{background:var(--soft);border-color:transparent;box-shadow:none;color:var(--mute);cursor:default}
.ppl button:disabled em{font-size:15px;font-weight:500;color:var(--mute)}
.txt{margin:0;display:grid;gap:2px;background:var(--soft);border-radius:14px;padding:12px 16px}
.txt dt{font-size:14px;font-weight:700;color:var(--mute)}
.txt dd{margin:0 0 8px;white-space:pre-line;font-size:18px;line-height:1.5;font-weight:700}
.txt dd .zh{display:block;font-size:14px;font-weight:500;color:var(--mute)}
.note{font-size:14px;color:var(--mute)}
.go{width:100%;min-height:56px;border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;line-height:1.2;font-family:inherit;font-family:inherit;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 20px;text-align:left;box-shadow:0 8px 20px rgba(0,87,184,.25)}
.go em{font-style:normal;font-size:20px;color:var(--arrow)}
.go:disabled{background:var(--soft);color:var(--mute);box-shadow:none}
.go:disabled em{color:inherit}
.btn{width:100%;min-height:52px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-weight:700;font-size:16px;line-height:1.2;font-family:inherit;font-family:inherit}
.go:active,.btn:active,.ppl button:active,.bft button:active{transform:scale(.97)}
.err{border-left:4px solid var(--red);background:var(--soft);border-radius:4px 14px 14px 4px;padding:12px 16px;font-size:16px}
.done{text-align:center;padding:24px 0 8px;display:grid;gap:8px;justify-items:center}
.done .ic{width:72px;height:72px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:36px;line-height:1;box-shadow:0 8px 20px rgba(0,87,184,.25)}
.done h2{font-size:26px}
.done p{margin:0}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:528px;margin:16px auto 0;width:calc(100% - 32px)}.bar i{display:block;height:4px;width:40%;border-radius:2px;background:var(--blue);animation:mv 1.2s ease-in-out infinite}
@keyframes mv{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* 簽名板：跟 iei.html 同一套 */
.board{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:none}
.bhd{position:relative;display:grid;gap:2px;background:var(--card);border-bottom:3px solid var(--ink)}   /* 跟小禾的簽名板同一個樣子（他 10/16） */
.bhd b{font-size:24px;line-height:1.2;font-weight:900;overflow-wrap:anywhere}
.bhd .zh{font-size:14px;color:var(--mute)}
.pad{flex:1;position:relative;background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.pad::after{content:"";position:absolute;left:24px;right:24px;top:70%;border-top:2px solid var(--ink);pointer-events:none}
.pad .hint{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:15px;color:var(--mute);pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.bft{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;padding:0 16px calc(12px + env(safe-area-inset-bottom))}
/* 簽名板一律橫的（他 10/16：客戶反應格子太小太窄。實測直拿是 343×324 的直長格，大家只寫得下一個大字，放進 IEI 的橫格只占 38%）。
   手機直拿 → 整塊轉 90 度（.rot），請他把手機橫過來簽；本來就橫拿 → 不用轉。標題壓成一行，把高度留給簽名格 */
#board.rot{inset:auto;top:0;left:100%;width:var(--bw);height:var(--bh);transform:rotate(90deg);transform-origin:0 0}
#board .bhd{display:flex;align-items:baseline;gap:10px;padding:8px 64px 8px 16px;white-space:nowrap;overflow:hidden}
#board .bhd b{font-size:20px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
#board .bhd .zh,#board .bhd .eye{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 4 auto}   /* 擠的時候先縮小標，名字最後才縮 */
#board .bhd .x{top:4px}
#board .pad{margin:8px 16px;min-height:120px}
#board .bft{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
#board .bft button{min-height:48px}

.bft button{min-height:54px;border-radius:16px;font-weight:700;font-size:15px;line-height:1.2;font-family:inherit;font-family:inherit;border:0;background:var(--card);color:var(--ink);padding:0 8px;box-shadow:var(--sh1)}
.bft .go{min-height:54px;padding:0 16px;box-shadow:0 8px 20px rgba(0,87,184,.25);background:var(--blue);color:#fff}
.bft .go:disabled{background:var(--soft);color:var(--mute);box-shadow:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.bar i{width:100%}}
</style></head><body>
<header><div class="eye" id="eye">簽名 · Sign</div><div class="ttl"><b id="ttl">…</b></div><div class="eye" id="sub"></div></header>
<div class="bar" id="bar"><i></i></div>
<main id="app"></main>
<div class="board" id="board" hidden>
  <div class="bhd"><b id="bwho"></b><span class="zh" id="bzh"></span></div>
  <div class="pad"><span class="hint" id="bsay"></span><canvas id="cv"></canvas></div>
  <div class="bft"><button type="button" id="b1"></button><button type="button" id="b2"></button><button type="button" class="go" id="b3"><span></span><em>→</em></button></div>
</div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbyZDD8YqjQ7_lBzyNyILy3jJfFsIWlVtz_ouhPJxakT7ka6F4Ou2sYn2khQiJmXY3U/exec';
var TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^\w.-]/g, '').slice(0, 80);
/* 介面字串：移工那張用他的語言（一張紀錄只有一個國籍），雇主用中文 */
var T = {
  '英': { pick: 'Tap your name', read: 'Please read', proc: 'What we did', res: 'Result', go: 'I have read it. Sign', hint: 'Please sign here.',
          back: 'Back', clear: 'Clear', submit: 'Submit', sending: 'Sending…', thanks: 'Thank you!', thanksMsg: 'Your signature has been sent.',
          signed: 'Signed', next: 'Back to the list', zh: 'The Chinese text is the official record.', needSign: 'Please sign first',
          err: 'Could not send. Please try again.', taken: 'This name has already signed.',
          warn: 'Warning letter', nth: ['1st warning', '2nd warning', '3rd warning'], vio: 'Rules broken', three: 'After three warning letters, you will be sent back to your home country.' },
  '越': { pick: 'Chạm vào tên của bạn', read: 'Vui lòng đọc', proc: 'Nội dung xử lý', res: 'Kết quả', go: 'Tôi đã đọc. Ký tên', hint: 'Vui lòng ký tên tại đây.',
          back: 'Quay lại', clear: 'Xóa', submit: 'Gửi', sending: 'Đang gửi…', thanks: 'Cảm ơn bạn!', thanksMsg: 'Chữ ký của bạn đã được gửi.',
          signed: 'Đã ký', next: 'Quay lại danh sách', zh: 'Bản tiếng Trung là bản chính thức.', needSign: 'Vui lòng ký tên trước',
          err: 'Không gửi được. Vui lòng thử lại.', taken: 'Tên này đã ký rồi.',
          warn: 'Thư cảnh cáo', nth: ['Cảnh cáo lần 1', 'Cảnh cáo lần 2', 'Cảnh cáo lần 3'], vio: 'Các vi phạm', three: 'Nhận đủ ba thư cảnh cáo sẽ bị đưa về nước.' },
  '印': { pick: 'Ketuk nama Anda', read: 'Silakan baca', proc: 'Proses penanganan', res: 'Hasil', go: 'Sudah saya baca. Tanda tangan', hint: 'Silakan tanda tangan di sini.',
          back: 'Kembali', clear: 'Hapus', submit: 'Kirim', sending: 'Mengirim…', thanks: 'Terima kasih!', thanksMsg: 'Tanda tangan Anda sudah terkirim.',
          signed: 'Sudah', next: 'Kembali ke daftar', zh: 'Versi bahasa Mandarin adalah catatan resmi.', needSign: 'Silakan tanda tangan dulu',
          err: 'Gagal mengirim. Silakan coba lagi.', taken: 'Nama ini sudah tanda tangan.',
          warn: 'Surat peringatan', nth: ['Peringatan ke-1', 'Peringatan ke-2', 'Peringatan ke-3'], vio: 'Pelanggaran', three: 'Setelah menerima tiga surat peringatan, Anda akan dipulangkan ke negara asal.' },
  '泰': { pick: 'แตะชื่อของคุณ', read: 'กรุณาอ่าน', proc: 'การดำเนินการ', res: 'ผลลัพธ์', go: 'อ่านแล้ว เซ็นชื่อ', hint: 'กรุณาเซ็นชื่อที่นี่',
          back: 'กลับ', clear: 'ลบ', submit: 'ส่ง', sending: 'กำลังส่ง…', thanks: 'ขอบคุณ!', thanksMsg: 'ส่งลายเซ็นของคุณแล้ว',
          signed: 'เซ็นแล้ว', next: 'กลับไปที่รายชื่อ', zh: 'ฉบับภาษาจีนเป็นบันทึกทางการ', needSign: 'กรุณาเซ็นชื่อก่อน',
          err: 'ส่งไม่สำเร็จ กรุณาลองอีกครั้ง', taken: 'ชื่อนี้เซ็นแล้ว',
          warn: 'หนังสือเตือน', nth: ['เตือนครั้งที่ 1', 'เตือนครั้งที่ 2', 'เตือนครั้งที่ 3'], vio: 'ข้อที่ทำผิด', three: 'หากได้รับหนังสือเตือนครบสามครั้ง จะถูกส่งกลับประเทศ' },
  '中': { pick: '點你的名字', read: '請看一下', proc: '處理經過', res: '處理結果', go: '看完了，請簽名', hint: '請在這裡簽名',
          back: '返回', clear: '清除', submit: '送出', sending: '送出中…', thanks: '謝謝！', thanksMsg: '簽名已送出。',
          signed: '已簽', next: '回名單', zh: '', needSign: '請先簽名', err: '沒送出去，請再試一次', taken: '這個名字已經簽過了',
          warn: '警告單', nth: ['第一次警告', '第二次警告', '第三次警告'], vio: '違反事項', three: '收到警告書三次，將遣送回國。' }
};
var INFO = null, ME = null, L = T['中'];
function $(id) { return document.getElementById(id); }
function el(tag, txt, attrs) { var e = document.createElement(tag); if (txt != null) e.textContent = txt; for (var k in attrs || {}) e.setAttribute(k, attrs[k]); return e; }
/* ⛔ fetch 沒有預設逾時：工廠訊號差時會永遠掛著。照 sign.html：40 秒（Apps Script 冷啟動要 30 秒以上）試 2 次 */
function api(o, tries) {
  tries = tries || 2; o.t = TOKEN;
  var ctl = window.AbortController ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 40000);
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(o), signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(timer); return j; },
          function (e) { clearTimeout(timer); if (tries > 1) return api(o, tries - 1); throw { net: true }; });
}
function busy(on) { $('bar').hidden = !on; }
/* 出錯：還不知道他是誰，所以中英並列；網路問題給一顆「再試一次」 */
function fail(msg, retry) {
  busy(false); var a = $('app'); a.innerHTML = '';
  a.appendChild(el('div', msg + (retry ? '\nConnection problem. Please try again.' : '\nThis sign link is not valid or has expired.'), { class: 'err', style: 'white-space:pre-line' }));
  if (retry) { var b = el('button', '再試一次　Try again', { type: 'button', class: 'go' }); b.onclick = load; a.appendChild(b); }
  else a.appendChild(el('p', '請跟現場的翻譯人員確認 · Please ask the interpreter here.', { class: 'note' }));
}
function load() {
  busy(true);
  api({ api: 'qInfo' }).then(function (j) {
    if (!j.ok) return fail(j.err || '這個簽名連結無效');
    INFO = j; busy(false);
    $('ttl').textContent = j.cuName; $('sub').textContent = j.date;
    list();
  }, function () { fail('連不上，訊號可能不穩', true); });
}
/* 第一步：名單。還沒簽的在前面；簽好的變淡、不能點（點得到就會有人手滑蓋掉別人的） */
function list() {
  ME = null; window.scrollTo(0, 0);
  var W = T[INFO.lang], a = $('app'); a.innerHTML = '';
  var h = el('h2', W.pick); h.appendChild(el('small', '點你的名字')); a.appendChild(h);
  var ul = el('ul', null, { class: 'ppl' });
  INFO.people.slice().sort(function (x, y) { return x.signed - y.signed; }).forEach(function (p) {
    var cu = p.role === 'cu' || p.role === 'wc', lang = cu ? T['中'] : W, b = el('button', null, { type: 'button' }), nm = el('b', cu ? p.zh : (p.en || p.zh));
    var tag = [!cu && p.en && p.zh ? p.zh : '', cu ? '雇主' : '', p.role === 'wl' || p.role === 'wc' ? lang.warn : ''].filter(Boolean).join(' · ');   // 警告單是另一份，名字會出現兩次
    if (tag) nm.appendChild(el('small', tag));
    b.appendChild(nm); b.appendChild(el('em', p.signed ? '✓ ' + lang.signed : '→'));
    b.disabled = p.signed;
    b.onclick = function () { ME = p; L = lang; readIt(); };
    var li = el('li'); li.appendChild(b); ul.appendChild(li);
  });
  a.appendChild(ul);
}
/* 第二步：看處理經過／結果（移工看 IEI 存的譯文，中文附在下面；雇主看中文） */
function readIt() {
  window.scrollTo(0, 0);
  var a = $('app'), cu = ME.role === 'cu' || ME.role === 'wc', tx = cu ? INFO.cu : INFO.w, wn = ME.role === 'wl' || ME.role === 'wc'; a.innerHTML = '';
  var h = el('h2', cu ? ME.zh : (ME.en || ME.zh)); h.appendChild(el('small', wn ? L.warn + ' · ' + L.nth[(+ME.fq || 1) - 1] : L.read)); a.appendChild(h);
  var dl = el('dl', null, { class: 'txt' }), W = INFO.warn || { zh: [], tl: [], other: '' };
  /* 警告單：違反哪幾項（移工看 IEI 的譯文、中文附在下面）＋三次遣返；訪談：處理經過／結果 */
  (wn ? [[L.vio, (cu ? W.zh : W.tl).join('\n') + (W.other ? '\n' + W.other : ''), cu ? '' : W.zh.join('、')], [L.warn, L.three, '']]
      : [[L.proc, cu ? tx.p : tx.pt, cu ? '' : tx.p], [L.res, cu ? tx.a : tx.at, cu ? '' : tx.a]]).forEach(function (r) {
    if (!r[1] && !r[2]) return;
    dl.appendChild(el('dt', r[0])); var dd = el('dd', r[1] || r[2]); if (r[1] && r[2]) dd.appendChild(el('span', r[2], { class: 'zh' })); dl.appendChild(dd);
  });
  if (dl.children.length) { a.appendChild(dl); if (!cu && L.zh) a.appendChild(el('p', L.zh, { class: 'note' })); }
  var go = el('button', null, { type: 'button', class: 'go' }); go.appendChild(el('span', L.go)); go.appendChild(el('em', '→')); go.onclick = openBoard; a.appendChild(go);
  var bk = el('button', L.back, { type: 'button', class: 'btn' }); bk.onclick = list; a.appendChild(bk);
}
/* 第三步：全螢幕簽名板（同 iei.html：吃掉 touchmove、裁空白、最寬 600） */
var cv = $('cv'), cx = cv.getContext('2d'), inked = false, down = false, PNG = '';
function openBoard() {
  $('board').hidden = false; document.body.style.overflow = 'hidden';
  $('bwho').textContent = ME.role === 'cu' ? ME.zh : (ME.en || ME.zh);
  $('bsay').textContent = L.hint; $('bzh').textContent = L === T['中'] ? '' : '請在這裡簽名';
  $('b1').textContent = L.back; $('b2').textContent = L.clear; $('b3').firstChild.textContent = L.submit; $('b3').disabled = false;
  bFit();
  var r = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
  cx.setTransform(r, 0, 0, r, 0, 0); cx.lineWidth = 5; cx.lineCap = cx.lineJoin = 'round'; cx.strokeStyle = '#1B1C1E';
  inked = false;
}
function closeBoard() { $('board').hidden = true; document.body.style.overflow = ''; }
function bFit() {   // 簽名板一律橫的：直拿就整塊轉 90 度（寬高對調）
  var b = $('board'), w = innerWidth, h = innerHeight, rot = h > w;
  b.classList.toggle('rot', rot); b.style.setProperty('--bw', h + 'px'); b.style.setProperty('--bh', w + 'px');
}
function pt(e) {   // 轉過的板子：手指往下＝格子往右
  var b = cv.getBoundingClientRect();
  return $('board').classList.contains('rot') ? [e.clientY - b.top, b.right - e.clientX] : [e.clientX - b.left, e.clientY - b.top];
}
addEventListener('resize', function () {   // 簽到一半把手機轉過來：重新排版（畫的會清掉，重簽）
  if ($('board').hidden) return;
  var was = $('board').classList.contains('rot'); bFit();
  if (was !== $('board').classList.contains('rot')) openBoard();
});
cv.onpointerdown = function (e) { e.preventDefault(); down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) {} var p = pt(e); cx.beginPath(); cx.moveTo(p[0], p[1]); };
cv.onpointermove = function (e) { if (!down) return; e.preventDefault(); var p = pt(e); cx.lineTo(p[0], p[1]); cx.stroke(); inked = true; };
cv.onpointerup = cv.onpointercancel = function () { down = false; };
['touchstart', 'touchmove'].forEach(function (k) { cv.addEventListener(k, function (e) { e.preventDefault(); }, { passive: false }); });
document.addEventListener('touchmove', function (e) { if (!$('board').hidden) e.preventDefault(); }, { passive: false });
function crop() {
  var w = cv.width, h = cv.height, d = cx.getImageData(0, 0, w, h).data, x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 12) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  var pad = Math.round(Math.min(w, h) * 0.04); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  /* 寬最多 600、高最多 300；簽得又大又密的還是可能超過後端上限（5 萬字），就一直縮到放得下（10/14 工人簽大字被擋過） */
  var w0 = x1 - x0 + 1, h0 = y1 - y0 + 1, k = Math.min(1, 600 / w0, 300 / h0), o = document.createElement('canvas'), u;
  do {
    o.width = Math.max(1, Math.round(w0 * k)); o.height = Math.max(1, Math.round(h0 * k));
    o.getContext('2d').drawImage(cv, x0, y0, w0, h0, 0, 0, o.width, o.height);
    u = o.toDataURL('image/png'); k *= 0.8;
  } while (u.length > 45000 && k > 0.05);
  return u;
}
$('b1').onclick = closeBoard;
$('b2').onclick = function () { cx.clearRect(0, 0, cv.width, cv.height); inked = false; };
$('b3').onclick = function () {
  if (!inked) { alert(L.needSign); return; }
  PNG = crop(); send();
};
/* 送出。網路斷了簽名不丟：留在 PNG，按「再試一次」直接重送，不用重簽 */
function send() {
  busy(true); $('b3').disabled = true; $('b3').firstChild.textContent = L.sending;
  api({ api: 'qPut', i: ME.i, png: PNG }).then(function (j) {
    busy(false); closeBoard();
    if (j.ok) return thanks(j.dry);
    if (j.taken) { alert(L.taken); return load(); }
    sendFail(j.err);
  }, function () { busy(false); closeBoard(); sendFail(''); });
}
function sendFail(msg) {
  var a = $('app'); a.innerHTML = '';
  a.appendChild(el('div', L.err + (msg ? '\n' + msg : ''), { class: 'err', style: 'white-space:pre-line' }));
  var b = el('button', null, { type: 'button', class: 'go' }); b.appendChild(el('span', L.submit)); b.appendChild(el('em', '→')); b.onclick = send; a.appendChild(b);
  var bk = el('button', L.back, { type: 'button', class: 'btn' }); bk.onclick = list; a.appendChild(bk);
}
/* 謝謝；同一支手機給下一個人簽就按「回名單」（順便重讀誰簽了） */
function thanks(dry) {
  var a = $('app'); a.innerHTML = ''; window.scrollTo(0, 0);
  var d = el('div', null, { class: 'done' });
  d.appendChild(el('div', '✓', { class: 'ic' })); d.appendChild(el('h2', L.thanks)); d.appendChild(el('p', L.thanksMsg));
  if (dry) d.appendChild(el('p', '（試跑中：沒有真的送進 IEI）', { class: 'note' }));
  a.appendChild(d);
  var bk = el('button', L.next, { type: 'button', class: 'btn' }); bk.onclick = load; a.appendChild(bk);
}
if (!TOKEN) fail('這個簽名連結無效'); else load();
</script>
