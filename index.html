<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>羽禾服務紀錄</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B3B6F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="羽禾">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --brand:#1B3B6F; --brand-d:#132B52; --ink:#131A26; --ink2:#41506B; --ink3:#7F8CA3;
  --bg:#F4F6FA; --card:#fff; --line:#DDE3EC;
}
*{box-sizing:border-box}
/* 底色是白的，不是深藍——這一條是修「底部那塊深藍」用的，別改回去。

   2026-09-18 實測：iOS 給這個 PWA 的畫布只有 797px 高，螢幕是 858px。
   差的 61px 在網頁範圍之外，position:fixed 碰不到（試過 iframe 用
   top/bottom 撐開、改 flex，量出來都還是 61px，一毫米沒動）。
   那塊由 iOS 自己塗，用的就是這裡的底色。塗成白的，它就跟底部選單
   連成一片，看起來像選單貼到螢幕底部。

   上面狀態列那一條仍然是深藍：#app 和 #load 都是 fixed、自己帶深藍底，
   蓋在畫布上面，碰得到。 */
html,body{margin:0;height:100%;overflow:hidden;background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",
    "Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}

/* 狀態列那條由外殼撐出來，底色跟系統的頂欄同一個青色，接起來才不會有一條白邊 */
/* 2026-09-18：底部那條深藍色的空白是這裡造成的。
   iframe 原本用 height:100%，百分比高度要看容器的內容框怎麼算，
   實機上算出來比畫面短，底部沒碰到螢幕邊，露出 #app 的深藍（實測 61px）。

   ⚠️ 試過改成絕對定位 top/bottom 兩邊撐開——那是錯的，整個畫面縮成一小條。
   iframe 是「替換元素」，CSS 規範規定它絕對定位時 height:auto 會回去用
   自己的內建高度（150px），bottom 直接被忽略。

   正解是 flex：#app 撐滿畫面、上面留瀏海的位置，iframe 用 flex:1 吃掉
   剩下的全部。flex 對替換元素是可靠的，而且完全不碰百分比高度。
   min-height:0 是必要的——不寫的話 flex 項目不肯縮到內容高度以下。 */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);background:var(--brand)}
#frame{flex:1 1 auto;min-height:0;width:100%;border:0;display:block;background:var(--bg)}
/* ── 更新中的畫面 ─────────────────────────────────────
   換掉 iframe 的那三四秒裡面是一片白——那是瀏覽器在載新頁，不是當掉，
   但看起來一模一樣。這一層蓋在上面，用 App 自己的深藍當底，
   讀起來就是「App 正在做事」，不是「網頁掛了」。

   刻意不用轉圈圈：那是「不知道要多久」的通用符號，哪個網站都長那樣。
   App 自己的圖示配一條掃過去的細線，看起來是這個 App 的一部分。
   圖示的呼吸很慢（2.4 秒一次）——快的動態讀起來焦慮，慢的讀起來是「在跑，別急」。 */
/* ── 開場畫面（2026-09-24 牟佑彬指定 Digital Luxury）─────────
   深海藍 ＋ 玻璃鈦邊標記 ＋ 兩道大光弧 ＋ 1px 金線。

   ⛔ 全部用 CSS 畫，**不可以改成貼一張背景圖**。
      他給的參考圖是 1.3MB 的 PNG；壓成 WebP 還有 200-300KB。
      工人在工廠 4G 上要先下載完那張圖才能開始等 App——
      一張為了「讓等待好看」的圖反而讓等待變長。這一段約 3KB，
      跟著 index.html 一起到，而且任何螢幕尺寸都自動貼合。

   ⚠ 金色只出現三個地方：鈦邊、進度線、頁腳短橫。
     「載入中」是暖白不是金的——金色一多就變廉價感。

   ⚠ 這是**靜態**的，只有那條金線在動，所以只畫一次，
     不會每一幀重繪。大面積模糊在舊手機上很貴。 */
#load{position:fixed;inset:0;z-index:6;display:none;
  background:radial-gradient(120% 90% at 78% -8%,
    #1B3E66 0%, #102540 34%, #0A1729 60%, #060C15 100%);
  color:#fff;overflow:hidden;isolation:isolate;
  opacity:0;transform:scale(1.02);
  transition:opacity .34s ease, transform .34s cubic-bezier(.32,.72,0,1)}
#load.on{display:block;opacity:1;transform:none}

/* 上面那道像星球的弧：一個巨大的圓，只有邊緣 1.6px 吃到光 */
#load .arc{position:absolute;width:215%;aspect-ratio:1;border-radius:50%;
  left:-115%;top:-22%;pointer-events:none;
  background:radial-gradient(circle at 34% 30%,
    rgba(128,182,246,.26) 0%, rgba(46,98,160,.15) 34%, rgba(12,26,44,.05) 56%, rgba(8,16,28,0) 68%)}
#load .arc::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 8deg, transparent 0deg,
    rgba(190,225,255,.06) 18deg, rgba(210,232,252,.34) 44deg,
    rgba(150,200,250,.14) 72deg, transparent 112deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1.6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1.6px));
  /* ⛔ 這一層**不可以加旋轉動畫**。2026-09-24 實測：
     轉它的話 iPhone 13 上只剩 11fps（每幀 90ms，預算是 16ms）。
     原因是它是一個 839px 帶 radial-gradient 遮罩的圖層，
     每一幀都要重新光欄化。要「光沿著弧跑」請用下面的 .orb。 */}
/* 弧最亮處的暈。沒有這一層，邊緣會硬得像畫上去的 */
#load .halo{position:absolute;width:62%;aspect-ratio:1;right:-20%;top:2%;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(180,220,255,.20) 0%,transparent 66%);
  filter:blur(18px)}

/* 下面那道地平線 */
#load .hz{position:absolute;width:300%;height:150%;left:-100%;top:74%;
  border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 8%,
    rgba(28,64,106,.62) 0%, rgba(12,26,44,.86) 40%, #060B12 72%)}
#load .hz::after{content:'';position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 330deg, transparent 0deg,
    rgba(160,205,250,.18) 14deg, rgba(232,244,255,.80) 30deg,
    rgba(150,195,245,.20) 46deg, transparent 64deg);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.4px),#000 calc(100% - 1.4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.4px),#000 calc(100% - 1.4px))}
#load .hz::before{content:'';position:absolute;left:24%;right:18%;top:-3%;height:10%;
  background:radial-gradient(ellipse,rgba(200,230,255,.30),transparent 70%);
  filter:blur(11px)}

/* ── 弧上的流光（第二版，2026-09-24）──────────────────

   ★ 關鍵：【不旋轉，只淡入淡出】。
     四層靜止的亮邊，亮帶各在不同角度，輪流淡入淡出——
     看起來就是光沿著弧在跑。

   ⛔ 為什麼不直接轉（2026-09-24 實測，iPhone 13）：
       什麼都不動        16ms/幀  ← 預算
       整片弧旋轉        90ms/幀  ← 11fps
       光點沿著弧跑      29ms/幀  ← 34fps
     前兩種都是因為它們每一幀都要重新光柵化一個 839px 的遮罩圖層。
     opacity 不一樣——那是合成器的工作，圖層只畫一次。

   ⚠ 只有四個角度，所以週期要慢（22 秒）並且讓相鄰兩層重疊——
     快了或不重疊的話光會「跳」，那比不動還難看。 */
#load .arc .g{position:absolute;inset:0;border-radius:50%;opacity:0;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1.6px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1.6px),#000 calc(100% - 1.6px));
  animation:glow 22s linear infinite}
#load .arc .g1{background:conic-gradient(from 350deg,transparent 0deg,
  rgba(190,225,255,.12) 16deg,rgba(232,244,255,.88) 40deg,
  rgba(150,200,250,.30) 66deg,transparent 104deg);animation-delay:0s}
#load .arc .g2{background:conic-gradient(from 20deg,transparent 0deg,
  rgba(190,225,255,.12) 16deg,rgba(232,244,255,.88) 40deg,
  rgba(150,200,250,.30) 66deg,transparent 104deg);animation-delay:-16.5s}
#load .arc .g3{background:conic-gradient(from 50deg,transparent 0deg,
  rgba(190,225,255,.12) 16deg,rgba(232,244,255,.88) 40deg,
  rgba(150,200,250,.30) 66deg,transparent 104deg);animation-delay:-11s}
#load .arc .g4{background:conic-gradient(from 80deg,transparent 0deg,
  rgba(190,225,255,.12) 16deg,rgba(232,244,255,.88) 40deg,
  rgba(150,200,250,.30) 66deg,transparent 104deg);animation-delay:-5.5s}
/* 四層各亮四分之一的時間，頭尾各留一段重疊。 */
@keyframes glow{
  0%{opacity:0} 6%{opacity:1} 25%{opacity:1} 31%{opacity:0} 100%{opacity:0}}

/* ⛔ 這裡曾經有一顆「沿著大弧跑的光點」，2026-09-24 拿掉了。

   實測（scripts/splash_shot.js，iPhone 13）：
     什麼都不動          16ms/幀   ← 預算
     只有 logo 邊框流光   16ms/幀   ← 免費，留著
     光點沿著弧跑        29ms/幀   ← 34fps
     整片弧旋轉          90ms/幀   ← 11fps，第一版就是這個

   光點那一版已經把「轉的是 0 尺寸容器」「推成獨立圖層」都做了，
   還是 29ms——因為它經過的地方底下是那幾層大面積漸層，
   移動就要重新合成那一塊。**不要再試一次同樣的做法。**

   ⚠ 這是載入畫面：卡頓在這一刻讀起來就是「這個 App 很慢」，
     而那正好是它要避免的印象。 */

#load .mid{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;padding:0 28px;z-index:2}

/* 玻璃＋鈦邊。⚠ 不是圖片——原本這裡是 <img src="icon-192.png">，
   換成純 CSS 之後連那一次請求也省掉了。 */
#load .ic{width:78px;height:78px;border-radius:22px;position:relative;
  background:linear-gradient(152deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 58%);
  -webkit-backdrop-filter:blur(7px) saturate(130%);
  backdrop-filter:blur(7px) saturate(130%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 14px 34px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.22)}
/* 鈦邊：1px 漸層描邊。亮金→暗金→亮金，所以邊框會「轉折」，像金屬在反光 */
#load .ic::before{content:'';position:absolute;inset:0;border-radius:22px;padding:1px;
  background:linear-gradient(145deg,#F0DFBB 0%,#D9BE8A 22%,
    rgba(140,119,72,.35) 52%,#D9BE8A 82%,#F0DFBB 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* 玻璃面上那一道斜光 */
#load .ic::after{content:'';position:absolute;inset:0;border-radius:22px;
  pointer-events:none;background:linear-gradient(118deg,
    rgba(255,255,255,.20) 0%,rgba(255,255,255,.06) 28%,transparent 44%)}

/* ── 邊框流光（牟佑彬 2026-09-24：「亮光順著線條跑」）─────────
   一個會轉的圓錐漸層，被遮成只剩 1px 的環 → 亮點就沿著圓角方框跑。

   ⛔ 用 transform:rotate，不要用 @property 動 custom property。
      後者在舊 iOS（16.4 以前）不會動，而且失敗時是**安靜的**；
      transform 從 iOS 9 就有，退化路徑也只是「不轉」，邊框還在。
   ⚠ 轉一圈 4.6 秒。再快就變成「轉圈圈的等待符號」，
     那正是這個方向要避開的東西。 */
#load .ic .edge{position:absolute;inset:0;border-radius:22px;padding:1px;
  overflow:hidden;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
#load .ic .edge::before{content:'';position:absolute;left:50%;top:50%;
  width:210%;aspect-ratio:1;margin:-105% 0 0 -105%;
  background:conic-gradient(from 0deg,transparent 0 62%,
    rgba(240,223,187,.30) 72%,#FFF6E0 80%,rgba(240,223,187,.30) 88%,transparent 96%);
  animation:edgerun 4.6s linear infinite;will-change:transform}
@keyframes edgerun{to{transform:rotate(360deg)}}
#load .ic b{font-family:"Songti TC","Noto Serif TC",Georgia,serif;
  font-size:30px;font-weight:400;letter-spacing:.06em;color:#F0DFBB;
  line-height:1;position:relative;z-index:1;
  text-shadow:0 0 14px rgba(217,190,138,.35)}

/* 1px 金線。⛔ 進度是真的（見下面 loadStep），不要改成來回掃的假動畫。 */
#load .bar{width:136px;height:1px;margin-top:27px;overflow:hidden;
  background:rgba(255,255,255,.13)}
#load .bar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,rgba(217,190,138,.25),#F0DFBB);
  box-shadow:0 0 8px 0 rgba(240,223,187,.55);
  transition:width .45s cubic-bezier(.2,.7,.2,1)}
#load .msg{margin:16px 0 0;font-size:10.5px;font-weight:400;letter-spacing:.42em;
  text-indent:.42em;color:rgba(233,220,192,.62)}
#load .sub{margin:11px 0 0;font-size:12.5px;line-height:1.5;text-align:center;
  color:rgba(255,255,255,.5);min-height:1.5em;max-width:16em}

#load .sig{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 7%);
  text-align:center;z-index:2;margin:0}
#load .sig span{font-size:8px;letter-spacing:.34em;text-indent:.34em;
  color:rgba(217,190,138,.44)}
#load .sig u{display:block;width:34px;height:1px;background:rgba(217,190,138,.34);
  margin:9px auto 0}

@media (prefers-reduced-motion:reduce){
  #load{transition:none;transform:none}
  #load .bar i{transition:none}      /* 進度照走，只是不要滑動 */
  /* ⛔ 關掉動畫的人要看到「靜止但完整」的樣子，不是殘缺的樣子。
     流光停在右上（亮點停在邊框最自然的位置），大弧停在原角度。 */
  #load .ic .edge::before{animation:none;transform:rotate(38deg)}
  /* 四層只留第二層靜止點亮，不要四層疊在一起。 */
  #load .arc .g{animation:none;opacity:0}
  #load .arc .g2{opacity:1}
}

/* ── 安裝說明 ───────────────────────────────────────
   同事拿到的是一條連結，不是安裝檔。這一頁要在三秒內
   讓他知道「在自己這支手機上」要按哪裡。 */
#gate{position:fixed;inset:0;z-index:9;background:var(--bg);color:var(--ink);
  overflow-y:auto;padding:calc(env(safe-area-inset-top) + 34px) 22px
    calc(env(safe-area-inset-bottom) + 30px)}
#gate.hide{display:none}
.wrap{max-width:420px;margin:0 auto}
.mark{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.mark img{width:58px;height:58px;border-radius:14px;display:block;
  box-shadow:0 6px 18px rgba(21,97,109,.22)}
.mark h1{margin:0;font-size:21px;letter-spacing:.04em}
.mark p{margin:3px 0 0;font-size:13px;color:var(--ink3)}

/* 教學入口放在最上面：第一次開這頁的人最需要的就是它。
   白底藍字，看得出可以按，但不跟主要動作「直接安裝」（實心深藍）搶份量。 */
.guide{display:flex;align-items:center;gap:12px;text-decoration:none;
  padding:14px 15px;margin:0 0 20px;border-radius:13px;
  border:1px solid var(--brand);background:var(--card);
  box-shadow:0 1px 3px rgba(27,59,111,.10)}
.guide span{flex:1;min-width:0}
.guide b{display:block;font-size:15px;color:var(--brand);letter-spacing:.01em}
.guide em{display:block;font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:3px}
.guide i{flex:none;font-size:22px;line-height:1;color:var(--brand);font-style:normal}
.guide:active{background:#F0F4FB}

.lead{font-size:15px;line-height:1.75;color:var(--ink2);margin:0 0 22px}
.lead b{color:var(--ink)}

.plat{display:flex;gap:7px;margin-bottom:18px}
.plat button{flex:1;padding:9px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-family:inherit;font-size:13.5px;color:var(--ink2);cursor:pointer}
.plat button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}

ol{list-style:none;counter-reset:s;margin:0 0 22px;padding:0}
ol li{counter-increment:s;position:relative;padding:0 0 18px 42px;font-size:15px;
  line-height:1.65;color:var(--ink2)}
ol li::before{content:counter(s);position:absolute;left:0;top:-1px;width:27px;height:27px;
  border-radius:50%;background:var(--brand);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
ol li::after{content:"";position:absolute;left:13px;top:29px;bottom:4px;width:1px;
  background:var(--line)}
ol li:last-child{padding-bottom:0}
ol li:last-child::after{display:none}
ol li b{color:var(--ink)}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  padding:0 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  font-size:14px;vertical-align:-6px;margin:0 2px}

.note{font-size:13px;line-height:1.7;color:var(--ink3);border-left:2px solid var(--line);
  padding-left:12px;margin:0 0 24px}

.acts{display:flex;flex-direction:column;gap:9px}
.acts button{width:100%;padding:14px;border-radius:12px;font-family:inherit;font-size:15px;
  cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink2)}
.acts button.p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
#installBtn{display:none}

/* 嵌不進來的時候要講話，不要只留一片空白 */
#fallback{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;
  background:var(--card);border-top:1px solid var(--line);
  padding:13px 16px calc(env(safe-area-inset-bottom) + 13px);
  font-size:13.5px;line-height:1.6;color:var(--ink2)}
#fallback a{color:var(--brand);font-weight:700}
</style>
</head>
<body>


<!-- 一開始就蓋著：第一次開啟要等 Apps Script 冷啟動＋下載版面檔，
     在 4G 上好幾秒，中間是一片空的灰色（那是空 iframe 的底色）。
     下拉更新換 iframe 時也是同一個畫面。收掉的時機見下面的 hideLoad。 -->
<div id="load" class="on" aria-live="polite">
  <!-- 三層光。⚠ 順序不能換：地平線要壓在星球弧上面。 -->
  <span class="arc" aria-hidden="true"><span class="g g1"></span><span class="g g2"></span><span class="g g3"></span><span class="g g4"></span></span>
  <span class="halo" aria-hidden="true"></span>
  <span class="hz" aria-hidden="true"></span>
  <div class="mid">
    <!-- ⚠ 以前這裡是 <img src="icon-192.png">。換成純 CSS 的玻璃方塊，
         連那一次圖片請求都省掉了——而那一次請求正好卡在最不該卡的時候。 -->
    <div class="ic"><span class="edge" aria-hidden="true"></span><b>羽禾</b></div>
    <div class="bar"><i></i></div>
    <p class="msg" id="loadMsg">載入中</p>
    <p class="sub" id="loadSub"></p>
  </div>
  <p class="sig"><span>YU HER MANAGEMENT</span><u></u></p>
</div>
<div id="app">
  <!-- src 由下面的 script 組出來：網址帶 ?code= 時會一起傳進去，
       讓每個人用自己的專屬連結，不必把全公司的碼印在同一份手冊裡。 -->
  <iframe id="frame" title="羽禾服務紀錄"
          allow="clipboard-write; camera"></iframe>
</div>

<div id="fallback">
  這裡打不開的話，
  <a id="direct" href="https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec?page=svc"
     target="_blank" rel="noopener">用瀏覽器直接開啟</a>，功能一模一樣。
</div>

<div id="gate" class="hide">
  <div class="wrap">
    <div class="mark">
      <img src="icon-192.png" alt="">
      <div>
        <h1>羽禾服務紀錄</h1>
        <p>羽禾人力仲介 · 內部使用</p>
      </div>
    </div>

    <a class="guide" href="guide.html">
      <span>
        <b>第一次用？先看五分鐘教學</b>
        <em>從登入到送審，一步一步帶著做</em>
      </span>
      <i aria-hidden="true">›</i>
    </a>

    <p class="lead">裝到手機桌面之後，開起來<b>沒有網址列</b>，跟一般 App 一樣。
      不用去商店下載，也<b>不用重新安裝就會自動更新</b>。</p>

    <div class="plat">
      <button type="button" data-p="ios">iPhone</button>
      <button type="button" data-p="and">Android</button>
    </div>

    <ol id="steps"></ol>

    <p class="note" id="note"></p>

    <div class="acts">
      <button type="button" class="p" id="installBtn">直接安裝</button>
      <button type="button" id="skip">先不裝，直接使用</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;

  var STEPS = {
    ios: [
      '這一頁要用 <b>Safari</b> 打開。如果是從 LINE 點進來的，先按右下角的 '+
        '<span class="ic">⋯</span> 選「<b>用預設瀏覽器開啟</b>」。',
      '按畫面<b>最下面中間</b>的分享鍵 <span class="ic">↑</span>（一個方框往上的箭頭）。',
      '往下滑，找到「<b>加入主畫面</b>」。',
      '右上角按「<b>新增</b>」。桌面就會出現羽禾的圖示。'
    ],
    and: [
      '這一頁要用 <b>Chrome</b> 打開。從 LINE 點進來的話，先按右上角 '+
        '<span class="ic">⋮</span> 選「<b>用其他瀏覽器開啟</b>」。',
      '通常畫面下方會自己跳出「<b>安裝應用程式</b>」，點它就好。',
      '沒跳出來的話，按右上角 <span class="ic">⋮</span> → 「<b>安裝應用程式</b>」'+
        '（有些手機寫「加到主畫面」）。',
      '按「<b>安裝</b>」。App 列表跟桌面都會出現羽禾。'
    ]
  };
  var NOTE = {
    ios: 'iPhone 一定要用 Safari，Chrome 或 LINE 內建的瀏覽器沒有「加入主畫面」這個選項。',
    and: '裝好之後，它在多工切換裡會跟一般 App 長得一樣，不會出現在瀏覽器分頁裡。'
  };

  function show(p){
    $('steps').innerHTML = STEPS[p].map(function(t){ return '<li>'+t+'</li>'; }).join('');
    $('note').innerHTML = NOTE[p];
    [].forEach.call(document.querySelectorAll('.plat button'), function(b){
      b.className = (b.dataset.p === p) ? 'on' : '';
    });
  }
  [].forEach.call(document.querySelectorAll('.plat button'), function(b){
    b.addEventListener('click', function(){ show(b.dataset.p); });
  });
  show(isIOS ? 'ios' : 'and');

  // 裝過了、或者已經按過「先不裝」就不要再擋路
  var skipped = false;
  try { skipped = localStorage.getItem('yuher.skip') === '1'; } catch(e){}
  if(!standalone && !skipped) $('gate').classList.remove('hide');

  $('skip').addEventListener('click', function(){
    try { localStorage.setItem('yuher.skip','1'); } catch(e){}
    $('gate').classList.add('hide');
  });

  // Android 的 Chrome 會把安裝提示交給我們自己觸發，那就給一顆按鈕
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferred = e;
    $('installBtn').style.display = '';
  });
  $('installBtn').addEventListener('click', function(){
    if(!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function(){ deferred = null;
      $('installBtn').style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function(){
    try { localStorage.setItem('yuher.skip','1'); } catch(e){}
    $('gate').classList.add('hide');
  });

  // 嵌不進來（被瀏覽器擋掉）的話，十秒後給一條退路，不要留一片空白
  var loaded = false;
  $('frame').addEventListener('load', function(){ loaded = true; });
  setTimeout(function(){ if(!loaded) $('fallback').style.display = 'block'; }, 10000);

  /* 系統裡按「下拉更新」或「有新版本」時，由外殼來重載那個 iframe。
     裡面自己 location.reload() 重載的是 Apps Script 的沙箱網址，
     常常重載不回來變空白。網址後面加時間戳是為了繞過瀏覽器快取——
     不加的話按了等於沒按，還是拿到同一份舊畫面。

     ⚠️ 2026-09-18 修正：原本在這裡先讀一次 getAttribute('src') 存成 BASE。
     但 <iframe> 標籤上根本沒有 src，它是下面第二個 <script> 的 IIFE 才設的，
     而這一段在第一個 <script> 裡——所以 BASE 一直都是 null，
     按更新等於把 iframe 導到 https://mousteven.github.io/yuher-app/null&t=…
     （實測 404）。**下拉更新從來沒有真正動作過**，同事只好關掉 App 重開。

     改成按下去的當下才讀現在的網址，沒有先後順序的問題；
     順便把舊的 &t= 切掉，連按幾次不會愈接愈長。 */
  /* ⚠️ Apps Script 會在我們的 iframe 裡面再包一層（sandboxFrame），
     所以 $('frame').contentWindow 是 Google 的包裝層，不是程式真正跑的地方。
     往那裡送訊息送不到。但程式送訊息過來時，ev.source 就是它自己的視窗——
     記下來，之後要回話就對著它講。 */
  var APP_WIN = null;
  window.addEventListener('message', function(ev){
    var d = ev.data;
    if(!d || !d.yuher) return;
    APP_WIN = ev.source || APP_WIN;
    /* ⚠️ 只認 shown，不要「收到任何訊息就收」。
       ready 是程式一開始跑就送的，那時候資料還沒抓、畫面還是空的，
       那時收掉遮罩，使用者會看到深藍消失之後又一片白（他回報過）。
       shown 是程式那邊確認「畫面上有東西了」才送的。 */
    if(d.yuher === 'ready') loadStep(86);
    if(d.yuher === 'shown'){ loadStep(100); return; }   // 跑滿之後才切
    if(d.yuher === 'reload'){
      var cur = $('frame').src || '';
      if(!cur) return;                       // 還沒載入就不要亂導
      showLoad();
      $('frame').src = cur.split('&t=')[0] + '&t=' + Date.now();
    } else if(d.yuher === 'ready'){
      /* 頂端安全區域那一條由外殼塗色，程式告訴我們它的頂欄是什麼顏色。
         底部不用塗了：iframe 現在自己貼到螢幕底部，底欄是程式自己畫的。 */
      if(d.top) $('app').style.background = d.top;
      sendInsets();
    }
  });

  /* ── 載入／更新遮罩 ────────────────────────────────────
     第一次開啟要等 Apps Script 冷啟動＋下載版面檔，在 4G 上好幾秒；
     下拉更新換 iframe 時一樣。中間畫面是一片空的灰色（空 iframe 的底色），
     看起來跟當掉一模一樣。所以遮罩一開始就蓋著（HTML 裡直接帶 class="on"），
     等程式出聲才收。

     拖久了要說話。一直只寫「載入中」，人會開始懷疑是不是卡住——
     講出「現在到哪了」比多一個轉圈圈有用得多。 */
  var LOAD_T = [];
  function clearLoadTimers(){
    LOAD_T.forEach(clearTimeout);
    LOAD_T = [];
  }

  /* ── 進度條 ──────────────────────────────────────────
     四個里程碑都是真的發生的事，不是計時器假裝的：

       0 →  30   一開始，還在等 Apps Script 回那一頁
       →  62     iframe 載完了（那一頁到了，版面檔還在下載）
       →  86     程式開始跑（ready）
       → 100     畫面真的畫好了（shown）→ 跑滿，然後才切過去

     每一段之間用「每 180 毫秒往上限逼近一點點」慢慢爬，
     這樣它永遠在動、不會看起來卡住，但也永遠不會超過真實進度。
     這是 YouTube、GitHub 那種進度條的做法——重點不是精準，
     是「它一直在前進」這件事讓人願意等。 */
  var LOAD_P = 0, LOAD_CAP = 30, LOAD_TICK = null;
  function paintP(){
    var el = document.querySelector('#load .bar i');
    if(el) el.style.width = LOAD_P + '%';
  }
  function creep(){
    if(LOAD_P < LOAD_CAP){ LOAD_P += (LOAD_CAP - LOAD_P) * 0.16; paintP(); }
  }
  function loadStep(cap){
    if(cap <= LOAD_CAP && cap < 100) return;    // 只往前，不倒退
    LOAD_CAP = cap;
    if(cap >= 100){
      clearInterval(LOAD_TICK); LOAD_TICK = null;
      LOAD_P = 100; paintP();
      /* 跑滿之後停一下再切。少了這 220 毫秒，進度條會在「看起來還沒滿」
         的瞬間消失，讀起來像被打斷，不像完成。 */
      setTimeout(hideLoad, 220);
      return;
    }
    LOAD_P = Math.max(LOAD_P, cap * 0.55); paintP();
  }
  function startLoadTimers(){
    clearLoadTimers();
    LOAD_T = [
      setTimeout(function(){ $('loadSub').textContent = '正在下載版面…'; }, 3500),
      setTimeout(function(){ $('loadSub').textContent = '網路有點慢，再等一下'; }, 10000),
      /* 20 秒還沒回來就不要再假裝了，給一句他真的做得到的事 */
      setTimeout(function(){
        $('loadSub').textContent = '還是沒回來的話，關掉 App 重開比較快';
      }, 20000)
    ];
  }
  /* 按更新才叫「更新中」，第一次開啟是「載入中」——講的是不同件事 */
  function showLoad(){
    $('loadMsg').textContent = '更新中';
    $('loadSub').textContent = '';
    $('load').style.opacity = '';
    $('load').classList.add('on');
    LOAD_P = 0; LOAD_CAP = 30; paintP();
    clearInterval(LOAD_TICK);
    LOAD_TICK = setInterval(creep, 180);
    startLoadTimers();
  }
  function hideLoad(){
    clearLoadTimers();
    clearInterval(LOAD_TICK); LOAD_TICK = null;
    var el = $('load');
    if(!el || !el.classList.contains('on')) return;
    /* 淡出再拿掉，不要直接消失。底下的畫面已經畫好了，
       讓它從深藍後面浮出來，比硬切自然。 */
    el.style.opacity = '0';
    setTimeout(function(){ el.classList.remove('on'); el.style.opacity = ''; }, 240);
  }

  startLoadTimers();          // 遮罩一開始就蓋著，計時也要一開始就跑
  LOAD_TICK = setInterval(creep, 180);
  paintP();

  /* 保險一：程式出不了聲（版面檔掛了、或同事手上還是舊版不會送 shown）時，
     iframe 載完十二秒也收掉。設長一點是刻意的——正常情況下 shown 兩三秒就到，
     這條根本輪不到；設太短反而會在慢速網路下提早收掉，白畫面又冒出來。 */
  $('frame').addEventListener('load', function(){
    loadStep(62);                       // 那一頁到了，版面檔還在下載
    setTimeout(hideLoad, 12000);
  });
  /* 保險二：不管發生什麼事，35 秒後一定拿掉。
     寧可讓他看到壞掉的畫面自己判斷，也不要把他鎖在一片深藍裡什麼都不能做。 */
  setTimeout(function(){ try{ hideLoad(); }catch(e){} }, 35000);

  /* iPhone 底部那條 home 指示線的高度，iframe 裡面讀不到
     （env(safe-area-inset-*) 只有最外層的頁面拿得到）。
     結果就是系統的底部選單停在指示線上方，外殼的底色從下面露出來——
     原生 App 不會這樣，因為它的選單會一路鋪到螢幕最底下。
     這裡由外殼量好再傳進去，系統才有辦法把選單墊到底。 */
  function sendInsets(){
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;bottom:0;width:0;' +
      'height:env(safe-area-inset-bottom,0px)';
    document.body.appendChild(probe);
    var bottom = probe.offsetHeight;
    probe.remove();
    /* 畫布比螢幕矮的時候，底部那條橫線（home indicator）根本在畫布外面，
       程式不需要再自己留一份空間——留了就是白白多一條空白。
       2026-09-18 實測他的手機：螢幕 858、畫布 797，差 61。
       畫布有到底的手機差值是 0，那時候照樣回報真正的安全區域。 */
    if (screen.height - innerHeight > 20) bottom = 0;
    var w = APP_WIN || $('frame').contentWindow;   // 還沒打招呼之前只能先試包裝層
    try {
      w.postMessage({ yuher: 'insets', bottom: bottom }, '*');
    } catch(e){}
  }
  $('frame').addEventListener('load', function(){ setTimeout(sendInsets, 400); });
  addEventListener('resize', sendInsets);
  addEventListener('orientationchange', function(){ setTimeout(sendInsets, 300); });

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
<script>
/* 個人專屬連結：https://mousteven.github.io/yuher-app/?code=1234
   把 code 往下傳給 Apps Script，App 會直接用它登入，同事不用手動輸入。

   兩個細節：
   · 只收 1–40 個英數與連字號，其他一律忽略——不要讓網址參數變成注入點
     （**是 1 不是 4**：小倩的碼只有一位數 `0`，寫成 {4,40} 她就進不去了）
   · 帶進去之後把它從網址列拿掉（replaceState），
     免得同事把「含自己登入碼的網址」截圖轉給別人 */
(function () {
  var BASE = 'https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec?page=svc';
  var code = '';
  try {
    var m = /[?&]code=([A-Za-z0-9-]{1,40})/.exec(location.search);
    if (m) code = m[1];
  } catch (e) {}

  var url = BASE + (code ? ('&code=' + encodeURIComponent(code)) : '');
  var f = document.getElementById('frame');
  if (f) f.src = url;
  var d = document.getElementById('direct');
  if (d) d.href = url;

  if (code) {
    try {
      history.replaceState(null, '', location.pathname);
    } catch (e2) {}
  }
})();
</script>
