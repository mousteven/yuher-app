<!DOCTYPE html>
<!-- 服務紀錄表給雇主看的唯讀頁（他 2026-10-07 選第 15 招甲）。後端 migrant-worker-platform/src/LineWeek.gs svrLoad，走 doPost。
     連結＝紀錄代碼＋HMAC 簽章，只給那一筆；服務日 90 天後失效。樣式跟 s.html 同一套瑞士風。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<title>服務紀錄表</title>
<style>
:root{--bg:#FFFFFF;--ink:#111111;--mute:#6B6B6B;--soft:#F2F2F2;--hair:#DDDDDD;--red:#E63946;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;color-scheme:light}
html,body{margin:0;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;gap:12px;margin-bottom:12px}
header .bar{width:6px;background:var(--red);flex:none}
h1{font-size:34px;line-height:1.05;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;margin:6px 0 0}
section{border-top:2px solid var(--ink);padding:14px 0 16px;display:grid;gap:6px}
.lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--red)}
.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--hair);padding:8px 0}
.row b{flex:1}.row small{color:var(--mute);margin-left:6px;font-weight:400}
.row img,.sg{height:48px;width:130px;object-fit:contain;background:var(--soft)}
.no{font-size:13px;color:var(--red);font-weight:700}
#msg{padding:40px 0}
@media print{.wrap{padding:0}}
</style>
</head><body>
<div class="wrap" id="app"><p id="msg">載入中…</p></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec';
var TK = new URLSearchParams(location.search).get('tk') || '';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function sig(u) { return u ? '<img src="' + esc(u) + '" alt="簽名">' : '<span class="no">未簽</span>'; }
function sec(lab, html) { return html ? '<section><div class="lab">' + lab + '</div>' + html + '</section>' : ''; }
fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'svrLoad', tk: TK }) })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (!d || d.ok === false) throw new Error(d && d.err ? String(d.err).replace(/^Error:\s*/, '') : '伺服器沒有回應');
    document.getElementById('app').innerHTML =
      '<header><div class="bar"></div><div><h1>服務紀錄表</h1><p class="sub">羽禾管理顧問・' + esc(d.client) + '・' + esc(d.date) + '・' + esc(d.code) + '</p></div></header>' +
      sec('服務項目', '<div>' + esc([d.big, d.sub].filter(Boolean).join('・')) + '</div>' + (d.place ? '<div class="sub">' + esc(d.place) + '</div>' : '')) +
      sec('處理經過', d.did || d.dnote ? '<div>' + esc([d.did, d.dnote].filter(Boolean).join('；')) + '</div>' : '') +
      sec('結果', d.res || d.rnote ? '<div>' + esc([d.res, d.rnote].filter(Boolean).join('；')) + '</div>' : '') +
      sec('移工簽名', d.workers.map(function (w) { return '<div class="row"><b>' + esc(w.name) + '<small>' + esc(w.lang) + '</small></b>' + sig(w.sig) + '</div>'; }).join('')) +
      sec('雇主簽名', '<div class="row"><b>雇主</b>' + sig(d.sigEmployer) + '</div>') +
      sec('翻譯', '<div class="row"><b>' + esc(d.crew) + '</b>' + sig(d.sigStaff) + '</div>');
  })
  .catch(function (e) { document.getElementById('app').innerHTML = '<p id="msg">' + esc(e && e.message || e) + '</p>'; });
</script>
</body></html>
