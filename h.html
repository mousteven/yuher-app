<!--
  體檢通知：工人打開連結看到的那一頁

  ⛔ 這一頁住在 GitHub Pages，不在 Apps Script（2026-09-21 搬過來）。
     原因只有一個：Apps Script 代管的網頁，Google 會在最上面掛一條
     「這個應用程式是由 Google Apps Script 的使用者建立　檢舉濫用情形」。
     那條就印在體檢通知旁邊。對一個看不懂中文、剛收到陌生連結的移工來說，
     「檢舉濫用情形」六個字等於「這是詐騙」。
     它在我們的頁面外層，程式裡移不掉——只能不要住在那裡。

  ⛔ 所以這一頁沒有 google.script.run，改用 fetch 打 Apps Script 的
     JSON 介面（見下面 api()）。後端那一側在 HealthCheckPub.gs 的 hcApi_。

  ⛔ 檔名 h.html 不可以改。已經發出去的連結全部長這樣：
     mousteven.github.io/yuher-app/h.html?s=<短碼>
     改檔名就是讓所有已發出的通知變成 404。

  版型 N2（牟佑彬 2026-09-21 定案）＝ 9/19 的 P4 深色病歷封面 ＋ 細線分區。
  確認流程 V1 ＝ 9/19 的 C：生日當門 → 電話只確認後三碼。

  ⛔ 排版的重點不是「有哪些欄位」，是**哪一個欄位放大到佔半個畫面**。
     2026-09-20 我照功能清單一項一項長，每項變一列、列多了分灰卡，
     結果大日期不見了、三張灰卡把一張單切成三張，質感整個散掉。
     大日期（2.75rem 等寬）、星期、倒數、時段膠囊——那四樣是 P4 的骨架，
     不是裝飾，不可以降級成一般欄位。

  ⚠ 這一頁會被貼到工廠 LINE 群組，任何人都點得進來：
  1. 只認網址上的 t=（16 碼亂數），不接受任何「我是誰」的輸入。
  2. 車牌與司機電話鎖在確認後面。未確認的看得到有東西鎖著——
     不是空白、不是報錯，他才會去按。
  3. 姓名照牟佑彬 2026-09-20 的決定顯示全名，不遮。
  4. 電話只顯示遮罩後三碼。就算有人猜中生日也拿不到完整號碼。

  四個階段（同一個網址，內容自己換）：
    notice 只有日期 → car 車輛資訊到了 → today 當天報到 → done 結案
  結案之後連結不失效——404 會讓工人以為公司的系統壞了。
-->

<script>
/* ⛔ token 不可以用 JSON.stringify 包。
   Apps Script 的輸出型樣板標記會做 HTML 跳脫，JSON.stringify 加的那對引號
   會被 escape 成 &quot;，TOKEN 的值變成「"abc123"」——引號成了字串的一部分，
   查不到任何一列，每一條連結都顯示「Link not valid」。
   token 在 Code.gs 已經濾成 [0-9a-f]{0,32}，直接夾在引號裡是安全的。

   ⛔⛔ 這一段註解本身也踩過一次：原本在裡面「示範」錯誤寫法，
   其中有一組空的樣板標記。編譯器不管那是不是註解，照樣編成
   output.push( ); ——整頁 SyntaxError，而訊息指到 Code.gs 的 evaluate()。
   樣板檔的註解裡不要出現任何樣板標記。 */
/* 短碼從網址上的 ?s= 讀。
   ⛔ 只收 16 進位字元——網址是使用者可以隨手改的東西，
      不要把上面的字原封不動送進後端。
   （以前是 Apps Script 樣板注入的。那時候用 JSON.stringify 包了一層，
     樣板把引號跳脫成 HTML 實體混進短碼裡，每一條連結都顯示「無效」。
     現在從網址讀，沒有那個問題了。） */
var TOKEN = (function(){
  try {
    var m = /[?&]s=([^&]*)/.exec(location.search || '');
    return m ? decodeURIComponent(m[1]).replace(/[^0-9a-f]/g, '').slice(0, 32) : '';
  } catch(e){ return ''; }
})();

/* ── 跟後端要資料 ───────────────────────────────────
   這一頁在 GitHub Pages，後端在 Apps Script，是兩個網域。
   實測過那個端點會回 Access-Control-Allow-Origin: *，所以打得通。

   ⛔ POST 的 Content-Type 一定要是 text/plain。
      用 application/json 會觸發瀏覽器預檢（OPTIONS），
      而 Apps Script 沒有 doOptions，預檢直接失敗——
      症狀是「按了完全沒反應」，只有主控台看得到錯誤，
      在工人的手機上根本查不出來。

   ⛔ 只讀的用 GET，會寫東西的用 POST。
      生日不可以出現在網址上：網址會進伺服器記錄，那是個資。 */
var API_ = 'https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec';

function api(fn, body, ok, bad){
  var p, url = API_;
  if(body){
    body.api = fn; body.t = TOKEN;
    p = fetch(url, { method:'POST',
                     headers:{ 'Content-Type':'text/plain;charset=utf-8' },
                     body: JSON.stringify(body) });
  } else {
    p = fetch(url + '?api=' + encodeURIComponent(fn) +
              '&t=' + encodeURIComponent(TOKEN));
  }
  p.then(function(r){ return r.json(); })
   .then(function(j){ ok(j); })
   .catch(function(){ if(bad) bad(); });
}
var D = null, SHOT = null, STEP = 1, DOB = '', TAIL = '', HASP = false;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;'); }

      2026-09-20 共用過一次，畫面上出現兩次 DATE。
   ⛔ 醫院名稱不翻譯，只附真實英文名。各語言音譯出來的名字現實中不存在，
      招牌上沒有、地圖搜不到、計程車司機聽不懂。 */

    q1:'Ngày sinh của bạn?', q1z:'Để chắc chắn đúng là bạn',

    badDob:'Ngày này không giống ngày sinh.',
    inQ:'Bạn đã đến bệnh viện chưa?', inB:'Tôi đã đến', inOk:'Đã báo đến',
    rQ:'Chụp hóa đơn nộp tiền?',
    rWhy:'Có hóa đơn thì công ty không cần hỏi lại bạn nữa.',
    rB:'Chụp ảnh hóa đơn', rSub:'Chụp ngay hoặc chọn từ thư viện',
    send:'Gửi', fin:'Xong rồi', closed:'Lần khám này đã hoàn tất.',

function zhOnly(){ return !D || D.lang === 'zh'; }
function t(k){ return zhOnly() ? (ZH[k] || '') : ((T[D.lang] || T.en)[k] || ''); }
/** 欄位名一律「母語 中文」。只出中文時就只有中文。 */
function lbl(k){
  return zhOnly() ? esc(ZH[k])
    : (esc(t(k)) + ' <span class="zh">' + esc(ZH[k]) + '</span>');
}
/** 一句話的母語與中文兩行。只出中文時只有一行。 */
function two(k){
  return zhOnly() ? esc(t(k))
    : (esc(t(k)) + '<br><span style="font-family:var(--cjk);color:var(--w62)">' +
       esc(ZH[k]) + '</span>');
}

function head(){
  return '<div class="hd"><span class="cx"></span>' +
    '<div class="c"><span class="k">YU HER MANAGEMENT</span>' +
    '<b>' + esc(t('head')) + '</b></div>' +
    (D.caseNo ? '<span class="no">NO.<br>' + esc(D.caseNo) + '</span>' : '') +
    '</div>';
}
function band(){
  if(D.stage === 'done')
    return '<div class="band done">✓ ' + esc(t('closed')) + '</div>';
  if(D.stage === 'today')
    return '<div class="band">🏥 ' + esc(t('today')) +
      (D.time ? '<span class="r">' + esc(D.time) + '</span>' : '') + '</div>';
  return '';
}
var DOW_ = {
  vi:['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'],
  id:['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],
  th:['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],
  en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  zh:['星期日','星期一','星期二','星期三','星期四','星期五','星期六'] };
/* Sep 27。
   ⛔ 不要用純數字。越南、印尼、泰國的習慣都是「日在前」，
      所以 27/09 他們讀得對——**真正會害他們讀錯的是中文習慣的 9/27**。
      只要出現文字月份，日月順序就再也不重要了。
   ⛔ 四個語別統一用英文縮寫（牟佑彬 2026-09-21 選 A）。
      他們的居留證、機票、醫院單據上本來就是英文月份，認得；
      而且四則長得一樣，校對的時候錯了看得出來。 */
var MON_ = ['Jan','Feb','Mar','Apr','May','Jun',
            'Jul','Aug','Sep','Oct','Nov','Dec'];
function dparts(){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(D.date || '');
  if(!m) return null;
  var d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  return { big: MON_[+m[2]-1] + ' ' + (+m[3]), dow: d.getUTCDay(),
           zh: (+m[2]) + '月' + (+m[3]) + '日' };
}
function leftTxt(){
  if(D.days === null || D.days === undefined || D.days < 0) return '';
  if(D.days === 0) return t('today2');
  if(D.days === 1) return t('tmr');
  return t('left').replace('{n}', D.days);
}
/* 那顆膠囊要回答「我幾點要出門」，不是醫院幾點開門。
   ⛔ 車還沒定的時候絕對不可以顯示報到時間——
      他會以為那是上車時間，提早兩小時站在門口。 */
function timePill(){
  if(D.ride === '接送'){
    if(D.car && D.car.at){
      return '<div class="pill">🚐 ' + esc(D.car.at) + ' ' + esc(t('board')) +
        '</div>';
    }
    return '<div class="pill wait">' + esc(t('pickWait')) +
      (zhOnly() ? '' : '<span class="z">' + esc(ZH.pickWait) + '</span>') +
      '</div>';
  }
  if(!D.time) return '';
  return '<div class="pill">🏥 ' + esc(D.time) + ' ' + esc(t('arrive')) + '</div>';
}

function hero(){
  var p = dparts();
  if(!p) return '';
  var dw = (DOW_[zhOnly() ? 'zh' : D.lang] || DOW_.en)[p.dow];
  var l = leftTxt();
  return '<div class="big">' + esc(p.big) + '</div>' +
    '<div class="sub">' + esc(dw) +
      (zhOnly() ? '' : ' · ' + esc(DOW_.zh[p.dow])) +
      '　' + esc(p.zh) +
      (l ? ('　—　' + esc(l)) : '') + '</div>' +
    timePill();
}

/* ── 細線分區。N2 跟舊版的差別就在這裡：標籤用細線，不是灰卡。
   灰卡會把一張單切成三張，質感就散了。 ── */
function lab(k){
  return '<p class="lab">' + esc(t(k)) +
    (zhOnly() ? '' : ' <span class="zh">' + esc(ZH[k]) + '</span>') + '</p>';
}
function row(k, main, sub){
  if(!main) return '';
  return '<li><em>' + lbl(k) + '</em><div class="v"><b>' + main + '</b>' +
    (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div></li>';
}
function note(k){
  return '<li><em>' + lbl(k) + '</em><div class="v">' +
    '<b style="font-weight:400;font-size:14px;color:var(--w75)">' + two(k === 'ride' &&
      D.ride !== '接送' ? 'own' : 'pend') + '</b></div></li>';
}

function secWho(){
  /* 電話放這一區：這一區本來就是在回答「這是不是我」。
     ⛔ 只顯示遮罩過的後三碼，而且只在確認之後。
        本人看得出「對，是我的號碼」就夠了，
        在頁面上顯示完整號碼沒有任何額外用處。 */
  var ph = (D.ack && D.phoneTail)
    ? ('<li><em>' + lbl('phone') + '</em><div class="v">' +
       '<b class="num">' + esc(D.phoneTail) + '</b>' +
       '<span>' + esc(t('phoneNote')) + '</span></div></li>')
    : '';
  return lab('sWho') + '<ul class="rows">' + row('who', esc(D.name)) +
    ph + '</ul>';
}
function secWhere(){

  /* 醫院：拼音在上、中文在下。中文那個一定要在——

  if(D.hos){
    h += '<li><em>' + lbl('hos') + '</em><div class="v"><b>' +
      esc(D.hosLat || D.hos) + '</b>' +
      (D.hosLat ? '<span>' + esc(D.hos) + '</span>' : '') + '</div></li>';
  }
  /* 報到時間不會不見，只是退到這裡當一列——需要的時候查得到，
     但不佔最顯眼的位置。接送的場次尤其要分清楚：
     上車一個時間、報到另一個時間。 */
  if(D.time) h += row('checkin', '<span class="num">' + esc(D.time) + '</span>');
  /* 自行前往才有地址與地標（後端只在那種場次回傳）。
     ⚠ 地標排在地址前面。看不懂中文的人認得出「全家便利商店」，
       認不出「南平街 61 巷」——地址是給計程車司機看的，
       地標才是他自己找得到門口的東西。 */
  if(D.hosMark) h += row('mark', esc(D.hosMark));
  if(D.hosAddr) h += row('addr', esc(D.hosAddr));
  if(D.ride !== '接送' || !D.car){
    h += note('ride');
  } else {
    var c = D.car;
    h += row('ride', '<span class="num">' + esc(c.at) + '</span>');
    h += row('at', esc(c.where));
    if(c.locked){
      h += '<li><em>' + lbl('plate') + '</em><div class="v">' +
        '<b class="lk">🔒 ●●●-●●●●</b></div></li>' +
        '<li><em>' + lbl('drv') + '</em><div class="v">' +
        '<b class="lk">🔒 ●● 0●●●-●●●-●●●</b></div></li>';
    } else {
      h += row('plate', '<span class="num">' + esc(c.plate) + '</span>');
      h += row('drv', esc(c.driver));
    }
  }
  h += '</ul>';
  /* ⛔ 不可以加 target="_blank"（LINE 內建瀏覽器會吞掉，按了沒反應）。 */
  if(D.hosMap){
    h += '<a class="tel" href="' + esc(D.hosMap) + '">' +
      '<button type="button" class="s">🗺️ ' + esc(t('openMap')) +
      (zhOnly() ? '' : '<small>' + esc(ZH.openMap) + '</small>') +
      '</button></a>';
  }
  if(D.car && D.car.locked) h += '<div class="note">🔒 ' + two('lock') + '</div>';
  if(D.car && !D.car.locked && D.car.phone)
    h += '<a class="tel" href="tel:' + esc(D.car.phone) + '">' +
      '<button type="button" class="s">📞 ' + esc(t('call')) + '　' +
      esc(D.car.phone) + (zhOnly() ? '' : '<small>' + esc(ZH.call) + '</small>') +
      '</button></a>';
  return h;
}
function secWhat(){
  var items = D.bringList || [];
  if(!items.length && !D.feeFmt) return '';
  var anyZh = items.some(function(x){ return !x.t; });
  var h = lab('sWhat') + '<ul class="rows">';
  if(items.length){
    h += '<li><em>' + lbl('bring') + '</em><div class="v"><b>' +
      items.map(function(x){
        return x.t ? esc(x.t)
          : ('<span class="zhonly">' + esc(x.zh) + '</span>'); }).join(' · ') +
      '</b>' + (zhOnly() ? '' : '<span>' +
        esc(items.map(function(x){ return x.zh; }).join('・')) + '</span>') +
      '</div></li>';
  }
  if(D.feeFmt){
    h += '<li><em>' + lbl('fee') + '</em><div class="v">' +
      '<b class="num">' + esc(D.feeFmt) + '</b>' +
      (zhOnly() ? '' : '<span>' + esc(D.feeZh) + '</span>') + '</div></li>';
  }
  h += '</ul>';
  if(anyZh && !zhOnly()) h += '<div class="note">· ' + esc(t('onlyZh')) + '</div>';
  return h + secNote();
}

/* 注意事項。三條固定的（牟佑彬 9/19 範本裡那幾條）＋ 翻譯自己打的。
   ⛔ 放在「我知道了」上面。他要按確認一定會捲到這裡，等於強迫看過一次。
   ⛔ 翻譯打的那一條照樣收，但要標「只有中文」——不要假裝翻譯過。 */
function secNote(){
  /* ⛔ w3（改期與 500 車資）只在「我們接送」的場次出現。
     那是車資，自行前往的人沒有車可以錯過，印出來不成立。
     ⚠ 措辭寫「車資」不是「罰款」——那是你們多跑一趟的實際成本，
       寫成罰款在勞動法規上是另一回事。

     ⛔ w2 用 .hot 加重，而且排第二個（不是最後）。
     2026-09-21 我原本只寫「有糞便檢查，想大號的留到醫院」——
     只講了不方便。院方的紙本講的是**聘僱許可會被廢止**。
     那是他整份通知裡後果最重的一句，不能跟「記得拿收據」
     長得一樣、排在一樣的位置。 */
  var keys = ['w1', 'w2'];
  if(D.ride === '接送') keys.push('w3');
  keys.push('w4');
  var fixed = keys.map(function(k){
    return '<p' + (k === 'w2' ? ' class="hot"' : '') + '>' + esc(t(k)) +
      (zhOnly() ? '' : '<span class="z">' + esc(ZH[k]) + '</span>') + '</p>';
  }).join('');
  var mine = D.note
    ? ('<p class="only">· ' + esc(D.note) +
       (zhOnly() ? '' : '<span class="oz">' + esc(t('onlyZhNote')) + '</span>') +
       '</p>')
    : '';
  return '<div class="warnbox"><p class="t">' + esc(t('sNote')) +
    (zhOnly() ? '' : ' <span class="z">' + esc(ZH.sNote) + '</span>') + '</p>' +
    fixed + mine + '</div>';
}

/* ── 加入行事曆 ─────────────────────────────────── */
function calBtn(){
  if(!D.date || D.stage === 'done') return '';
  /* ⛔ 不可以加 target="_blank"。
     2026-09-21 實機：在 LINE 裡按了完全沒反應。
     LINE 的內建瀏覽器擋掉開新視窗，所以連結根本沒被走到——
     看起來像按鈕壞了，其實是 _blank 被吞了。同一頁跳轉才走得通。

     ⛔ 兩條路都要給。.ics 是檔案，LINE 內建瀏覽器多半擋下載；
     Google 日曆那條只是一般網頁跳轉，任何瀏覽器都走得通但要帳號。
     Android 幾乎都有帳號、iPhone 多半沒有但 Safari 認得 .ics。
     再加一行「用瀏覽器開」——那是 LINE 裡唯一一定有效的路。 */
  return '<a href="' + esc(D.icsUrl) + '">' +
    '<button type="button" class="s">📅 ' + esc(t('cal')) +
    (zhOnly() ? '' : '<small>' + esc(ZH.cal) + '</small>') + '</button></a>' +
    (D.gcalUrl ? '<a class="alt" href="' + esc(D.gcalUrl) + '">' +
      esc(t('cal2')) +
      (zhOnly() ? '' : '<span class="zh">' + esc(ZH.cal2) + '</span>') + '</a>'
      : '') +
    '<p class="why" style="text-align:center">' + esc(t('inApp')) +
      (zhOnly() ? '' : '<br><span class="zh">' + esc(ZH.inApp) + '</span>') +
    '</p>';
}

/* ── 確認 V1：兩步 ──────────────────────────────── */
var AGE_MIN = 14, AGE_MAX = 80;
function yrMax(){ return new Date().getFullYear() - AGE_MIN; }
function yrMin(){ return new Date().getFullYear() - AGE_MAX; }

function step1(){
  return '<p class="q">' + esc(t('q1')) + '</p>' +
    (zhOnly() ? '' : '<p class="qz">' + esc(ZH.q1) + '</p>') +
    '<p class="why">' + esc(t('q1z')) +
      (zhOnly() ? '' : '　·　<span class="zh">' + esc(ZH.q1z) + '</span>') + '</p>' +
    '<div class="fld"><div class="three">' +
      '<label><input id="dy" inputmode="numeric" maxlength="4" placeholder="----">' +
        '<em>' + esc(t('y')) + (zhOnly() ? '' : ' ' + ZH.y) + '</em></label>' +
      '<label><input id="dm" inputmode="numeric" maxlength="2" placeholder="--">' +
        '<em>' + esc(t('mo')) + (zhOnly() ? '' : ' ' + ZH.mo) + '</em></label>' +
      '<label><input id="dd" inputmode="numeric" maxlength="2" placeholder="--">' +
        '<em>' + esc(t('dd')) + (zhOnly() ? '' : ' ' + ZH.dd) + '</em></label>' +
      '</div>' +
      '<p class="hint">' + esc(t('likeArc')) +
        (zhOnly() ? '' : '　·　' + esc(ZH.likeArc)) + '</p></div>' +
    '<div id="er"></div>' +
    '<button type="button" id="go1">' + esc(t('next')) +
      (zhOnly() ? '' : '<small>' + esc(ZH.next) + '</small>') + '</button>';
}
function showErr(box, k){
  $(box).innerHTML = '<div class="err">' + esc(t(k)) +
    (zhOnly() ? '' : '<br><span class="zh">' + esc(ZH[k]) + '</span>') + '</div>';
}
function bind1(){
  /* 打滿就自己跳下一格。老手機上少按兩次，而且看得出來有反應。 */
  function hop(a, b){
    $(a).addEventListener('input', function(){
      $(a).value = $(a).value.replace(/[^0-9]/g, '');
      if(b && $(a).value.length >= +$(a).getAttribute('maxlength')) $(b).focus();
    });
  }
  hop('dy','dm'); hop('dm','dd'); hop('dd', null);
  $('go1').addEventListener('click', function(){
    var y = $('dy').value, m = $('dm').value, d = $('dd').value;
    if(y.length !== 4 || !m || !d){ $('dy').focus(); return; }
    if(+y < yrMin() || +y > yrMax()){ showErr('er', 'badDob'); return; }
    DOB = y + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2);
    var b = $('go1'); b.disabled = true;
    api('hcVerifyDob', { dob: DOB }, function(r){
      b.disabled = false;
      if(r && r.already){ load(); return; }
      if(r && r.ok){
        HASP = !!r.hasPhone; TAIL = r.phoneTail || ''; STEP = 2; draw(); return;
      }
      if(r && r.gone){ gone(); return; }
      if(r && r.badDob){ showErr('er', 'badDob'); return; }
      /* 生日對不上：換成專屬的錯誤畫面，不是一行紅字。
         ⛔ 不鎖定——鎖定會把真正的本人擋在外面，而他手上沒有別的管道。 */
      STEP = 'bad'; draw();
    }, function(){
      b.disabled = false;
      $('er').innerHTML = '<div class="err">Network error · 網路不穩，再試一次</div>';
    });
  });
}

function step2(){
  if(HASP){
    return '<p class="q">' + esc(t('q2')) + '</p>' +
      (zhOnly() ? '' : '<p class="qz">' + esc(ZH.q2) + '</p>') +
      '<div class="hasno"><span class="tz">' + esc(t('have')) +
        (zhOnly() ? '' : '　·　' + esc(ZH.have)) + '</span>' +
        '<div class="n">' + esc(TAIL) + '</div></div>' +
      '<div id="newp"></div>' +
      '<div class="two">' +
        '<button type="button" class="s" id="chg">' + esc(t('changed')) +
          (zhOnly() ? '' : '<small>' + esc(ZH.changed) + '</small>') + '</button>' +
        '<button type="button" id="same">' + esc(t('same')) + ' ✓' +
          (zhOnly() ? '' : '<small>' + esc(ZH.same) + '</small>') + '</button>' +
      '</div>' +
      '<p class="why">' + esc(t('only3')) +
        (zhOnly() ? '' : '　·　<span class="zh">' + esc(ZH.only3) + '</span>') + '</p>';
  }
  /* 名冊上沒有號碼——這是「收集」那一輪。
     ⛔ 不要用電話卡住確認：沒留電話照樣算確認過。 */
  return '<p class="q">' + esc(t('q2b')) + '</p>' +
    (zhOnly() ? '' : '<p class="qz">' + esc(ZH.q2b) + '</p>') +
    '<p class="why">' + esc(t('noPhone')) +
      (zhOnly() ? '' : '　·　<span class="zh">' + esc(ZH.noPhone) + '</span>') + '</p>' +
    '<div class="fld"><input class="line" id="ph" type="tel" inputmode="tel" ' +
      'placeholder="09xx-xxx-xxx"></div>' +
    '<button type="button" id="done">' + esc(t('okT')) + ' ✓' +
      (zhOnly() ? '' : '<small>' + esc(ZH.okT) + '</small>') + '</button>' +
    '<a class="alt" id="nop">' + esc(t('skip')) +
      (zhOnly() ? '' : '<span class="zh">' + esc(ZH.skip) + '</span>') + '</a>';
}
function bind2(){
  function submit(phone){
    var bs = document.querySelectorAll('#app button');
    [].forEach.call(bs, function(b){ b.disabled = true; });
    api('hcAck', { dob: DOB, phone: phone || '' }, function(r){
      if(r && r.ok){ STEP = 1; load(); return; }
      [].forEach.call(bs, function(b){ b.disabled = false; });
      if(r && r.gone){ gone(); return; }
      STEP = 'bad'; draw();
    }, function(){
      [].forEach.call(bs, function(b){ b.disabled = false; });
    });
  }
  if($('same')) $('same').addEventListener('click', function(){ submit(''); });
  if($('chg')) $('chg').addEventListener('click', function(){
    /* 第一下換成輸入框，第二下才送出。不要一按就跳走，
       他可能只是想看看號碼長什麼樣。 */
    if(!$('ph')){
      $('newp').innerHTML = '<div class="fld"><input class="line" id="ph" ' +
        'type="tel" inputmode="tel" placeholder="09xx-xxx-xxx"></div>';
      $('ph').focus();
      $('chg').innerHTML = esc(t('send'));
      return;
    }
    submit($('ph').value.trim());
  });
  if($('done')) $('done').addEventListener('click', function(){
    submit($('ph').value.trim()); });
  if($('nop')) $('nop').addEventListener('click', function(){ submit(''); });
}

function badPage(){
  return head() +
    '<div class="badp"><div class="m">✕</div>' +
    '<b>' + esc(t('badT')) + '</b>' +
    '<span>' + (zhOnly() ? '' : esc(ZH.badT) + '<br>') + esc(t('badS')) + '</span>' +
    (D.tel
      ? ('<a class="tel" href="tel:' + esc(D.tel) + '"><span class="telno">' +
         esc(t('callUs')) + ' ' + esc(D.tel) + '</span></a>')
      : ('<span>' + esc(t('askTr')) +
         (zhOnly() ? '' : '<br>' + esc(ZH.askTr)) + '</span>')) +
    '</div><div class="pad">' +
    '<button type="button" id="retry">' + esc(t('retry')) +
      (zhOnly() ? '' : '<small>' + esc(ZH.retry) + '</small>') + '</button></div>';
}

/* ── 當天報到與收據 ─────────────────────────────── */
function askIn(){
  return '<p class="q">' + esc(t('inQ')) + '</p>' +
    (zhOnly() ? '' : '<p class="qz">' + esc(ZH.inQ) + '</p>') +
    '<button type="button" id="in">' + esc(t('inB')) + ' ✓' +
      (zhOnly() ? '' : '<small>' + esc(ZH.inB) + '</small>') + '</button>';
}
function bindIn(){
  $('in').addEventListener('click', function(){
    var b = $('in'); b.disabled = true;
    api('hcCheckin', {}, function(){ load(); },
        function(){ b.disabled = false; });
  });
}
function askReceipt(){
  if(D.receipt)
    return '<div class="big2"><div class="m">✓</div><b>' + esc(t('fin')) +
      '</b><span>' + esc(ZH.fin) + '</span></div>';
  return '<p class="q">' + esc(t('rQ')) + '</p>' +
    (zhOnly() ? '' : '<p class="qz">' + esc(ZH.rQ) + '</p>') +
    '<p class="why">' + esc(t('rWhy')) +
      (zhOnly() ? '' : '<br><span class="zh">' + esc(ZH.rWhy) + '</span>') + '</p>' +
    '<label class="up" for="f"><div class="ic">📷</div><b>' + esc(t('rB')) +
      '</b><span>' + esc(t('rSub')) + (zhOnly() ? '' : '<br>' + esc(ZH.rB)) +
      '</span><input id="f" type="file" accept="image/*" capture="environment">' +
      '</label><div id="pv"></div><div id="er2"></div>';
}
function bindReceipt(){
  var f = $('f'); if(!f) return;
  f.addEventListener('change', function(){
    var file = f.files && f.files[0]; if(!file) return;
    if(file.size > 6 * 1024 * 1024){
      $('er2').innerHTML = '<div class="err">Too large · 照片太大，請重拍一張</div>';
      return;
    }
    var rd = new FileReader();
    rd.onload = function(){
      SHOT = { mime: file.type, b64: String(rd.result).split(',')[1] };
      $('pv').innerHTML = '<div class="shot"><img src="' + rd.result + '" alt="">' +
        '<div><b>' + esc(file.name.slice(0, 22)) + '</b>' +
        '<span>' + Math.round(file.size / 1024) + ' KB</span></div></div>' +
        '<button type="button" id="snd">' + esc(t('send')) + '</button>';
      $('snd').addEventListener('click', send);
    };
    rd.readAsDataURL(file);
  });
}
function send(){
  var b = $('snd'); b.disabled = true; b.textContent = '…';
  api('hcReceipt', { mime: SHOT.mime, b64: SHOT.b64 }, function(r){
    if(r && r.ok){ load(); return; }
    b.disabled = false; b.textContent = t('send');
    $('er2').innerHTML = '<div class="err">' +
      (r && r.tooBig ? 'Too large · 照片太大' : 'Failed · 沒傳成功，再試一次') +
      '</div>';
  }, function(){
    b.disabled = false; b.textContent = t('send');
    $('er2').innerHTML = '<div class="err">Network error · 網路不穩，再試一次</div>';
  });
}

/* ── 組裝 ───────────────────────────────────────── */
function draw(){
  document.body.className = (D.lang === 'th') ? 'th' : '';

  if(STEP === 'bad'){
    $('app').innerHTML = '<div class="pg">' + badPage() + '</div>';
    $('retry').addEventListener('click', function(){ STEP = 1; draw(); });
    return;
  }
  /* 第二步接管整個畫面。已經走到這裡的人，最重要的事是把它按完——
     底下那一大張通知這時候只會讓他分心。 */
  if(!D.ack && D.stage !== 'done' && STEP === 2){
    $('app').innerHTML = '<div class="pg">' + head() +
      '<div class="bd">' + step2() + '</div>' +
      '<div class="prog"><i class="on"></i><i class="on"></i></div></div>';
    bind2(); return;
  }

  var h = head() + band() + '<div class="bd">';
  if(D.ack) h += '<div class="ok"><span class="m">✓</span><div><b>' +
    esc(t('okT')) + '</b><span>' + esc(ZH.okT) + '</span></div></div>';

  if(D.stage === 'done'){
    h += '<div class="big2"><div class="m">✓</div><b>' + esc(t('closed')) +
      '</b><span>' + esc(ZH.closed) + '</span></div>' + hero() + '</div>';
    $('app').innerHTML = '<div class="pg">' + h + '</div>';
    return;
  }

  h += hero() + secWho() + secWhere() + secWhat() + '</div>';

  var foot = '';
  if(!D.ack){
    foot = '<div class="bd" style="padding-top:0">' + step1() + '</div>' +
      '<div class="prog"><i class="on"></i><i></i></div>';
  } else {
    if(D.stage === 'today' && D.inAt){
      foot = '<div class="bd" style="padding-top:0">' +
        '<div class="ok"><span class="m">✓</span><div><b>' + esc(t('inOk')) +
        '</b><span>' + esc(ZH.inOk) + '</span></div></div>' +
        askReceipt() + '</div>';
    } else if(D.stage === 'today' && D.canIn){
      foot = '<div class="bd" style="padding-top:0">' + askIn() + '</div>';
    }
    foot += '<div class="pad">' + calBtn() + '</div>';
  }

  $('app').innerHTML = '<div class="pg">' + h + foot + '</div>';
  if($('go1')) bind1();
  if($('in')) bindIn();
  if($('f')) bindReceipt();
}
function gone(){
  $('app').innerHTML = '<div class="pg"><div class="badp">' +
    '<div class="m">!</div><b>Link not valid</b>' +
    '<span>這個連結無效或已經過期。<br>請聯絡你的翻譯。</span></div></div>';
}
function load(){
  /* 短碼根本不在網址上（有人手打了半截、或連結被截斷）——
     直接給無效畫面，不要打後端。 */
  if(!TOKEN){ gone(); return; }
  api('hcView', null, function(r){
    if(!r || !r.ok){ gone(); return; }
    D = r; draw();
  }, function(){
    $('app').innerHTML = '<p class="load">網路不穩，請下拉重新整理</p>';
  });
}
load();
</script>
