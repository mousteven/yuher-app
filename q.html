<!DOCTYPE html>
<!-- 一對一問卷頁（他 2026-10-07 選第 7 招乙）。翻譯在 LINE 私訊「問卷 偉霸 續聘 泰文」→ 轉傳連結到群組 → 工人在這裡填。
     後端 migrant-worker-platform/src/LineSurvey.gs，走 doPost 的 svyLoad／svySave。結果在 LINE 打「問卷結果」看。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<title>問卷</title>
<style>
/* 瑞士風，同 s.html：白底黑字、單一紅色、細線分隔。輸入框 16px 防 iPhone 自動放大 */
:root{--bg:#FFFFFF;--ink:#111111;--mute:#6B6B6B;--hair:#DDDDDD;--red:#E63946;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC","Noto Sans Thai","Noto Sans",sans-serif;color-scheme:light}
html,body{margin:0;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);touch-action:pan-y}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
header{display:flex;gap:12px;margin-bottom:12px}
header .bar{width:6px;background:var(--red);flex:none}
h1{font-size:30px;line-height:1.15;font-weight:900;margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;margin:6px 0 0}
section{border-top:2px solid var(--ink);padding:14px 0 16px;display:grid;gap:10px}
.lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--red)}
input,textarea{font:inherit;font-size:16px;width:100%;border:0;border-bottom:1px solid var(--ink);padding:10px 2px;background:transparent;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:none;border-bottom:2px solid var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:16px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);padding:10px 14px;border-radius:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
.chip small{display:block;font-size:12px;color:inherit;opacity:.7}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;font:inherit;font-weight:700;font-size:17px;padding:15px 16px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;border-radius:0}
.dock button span{color:var(--red)}
.dock button:disabled{opacity:.5}
#msg{padding:40px 0;font-size:17px}
.err{color:var(--red);font-size:14px;font-weight:700;margin:0}
</style>
</head><body>
<div class="wrap" id="app"><p id="msg">Loading… 載入中…</p></div>
<div class="dock" id="dock" hidden><button id="go"><b id="goT">Send 送出</b><span>→</span></button></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec';
var TK = new URLSearchParams(location.search).get('tk') || '';
var L = {   // 介面字（母語＋中文）
  en: ['Name', 'Answer', 'Reason (optional)', 'Send', 'Thank you! Sent.', 'Please write your name', 'Please choose one'],
  vi: ['Tên', 'Trả lời', 'Lý do (không bắt buộc)', 'Gửi', 'Cảm ơn! Đã gửi.', 'Vui lòng ghi tên', 'Vui lòng chọn một'],
  id: ['Nama', 'Jawaban', 'Alasan (boleh kosong)', 'Kirim', 'Terima kasih! Sudah terkirim.', 'Tolong tulis nama', 'Tolong pilih satu'],
  th: ['ชื่อ', 'คำตอบ', 'เหตุผล (ไม่บังคับ)', 'ส่ง', 'ขอบคุณ! ส่งแล้ว', 'กรุณาใส่ชื่อ', 'กรุณาเลือกหนึ่งข้อ'] };
var ZH = ['名字', '回答', '原因（可不填）', '送出', '謝謝！已送出。', '請填名字', '請選一個'];
var D = null, PICK = -1;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function t(i) { var l = (L[D && D.lang] || L.en)[i]; return l + ' ' + ZH[i]; }
function api(body) {   // text/plain：application/json 會觸發預檢，Apps Script 接不住
  body.tk = TK;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || j.ok === false) throw new Error(j && j.err ? String(j.err).replace(/^Error:\s*/, '') : '伺服器沒有回應'); return j; });
}
function fail(e) { $('app').innerHTML = '<p id="msg">' + esc(e && e.message || e) + '</p>'; $('dock').hidden = true; }

api({ api: 'svyLoad' }).then(function (d) { D = d; init(); }).catch(fail);

function init() {
  $('app').innerHTML =
    '<header><div class="bar"></div><div><h1>' + esc(D.tr || D.zh) + '</h1><p class="sub">' + esc(D.zh) + (D.group ? '・' + esc(D.group) : '') + '</p></div></header>' +
    '<section><div class="lab">' + esc(t(0)) + '</div><input type="text" id="nm" maxlength="40" autocomplete="name"></section>' +
    '<section><div class="lab">' + esc(t(1)) + '</div><div class="chips" id="ops">' +
      D.opts.map(function (o, i) { return '<button type="button" class="chip" aria-pressed="false" data-i="' + i + '">' + esc(o.t || o.z) + (o.t ? '<small>' + esc(o.z) + '</small>' : '') + '</button>'; }).join('') +
    '</div></section>' +
    '<section><div class="lab">' + esc(t(2)) + '</div><textarea id="why" maxlength="300"></textarea><p class="err" id="err"></p></section>';
  $('goT').textContent = t(3);
  $('dock').hidden = false;
  $('ops').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    PICK = +b.dataset.i;
    [].forEach.call($('ops').children, function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });
}

$('go').addEventListener('click', function () {
  var nm = $('nm').value.trim();
  if (!nm) { $('err').textContent = t(5); $('nm').focus(); return; }
  if (PICK < 0) { $('err').textContent = t(6); return; }
  $('go').disabled = true; $('err').textContent = '';
  api({ api: 'svySave', ans: { name: nm, i: PICK, why: $('why').value } })
    .then(function () { $('app').innerHTML = '<p id="msg">' + esc(t(4)) + '</p>'; $('dock').hidden = true; })
    .catch(function (e) { $('go').disabled = false; $('err').textContent = e.message || e; });
});
</script>
</body></html>
