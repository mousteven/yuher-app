<!DOCTYPE html>
<!-- 今日路線（他 2026-10-12 定案：甲「格線」）。小羽「今天行程」第一張「看地圖・調整順序」打開這一頁。
     後端 migrant-worker-platform/src/LineRoute.gs，走 doPost 的 rtLoad／rtLegs／rtSave；連結自帶簽章（名字＋日期）。
     地圖跟 App 特助路線頁同一份 twmap.js（鄉鎮中心，不是門牌）；分鐘／公里是 Google 算的開車時間。 -->
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<title>今日路線</title>
<style>
/* 瑞士風「格線」：白底黑字、黑細線分格、紅色只給路線和下午。只有淺色一套（跟 s.html、LINE 卡片一致） */
:root{--bg:#FFFFFF;--ink:#111111;--mute:#6B6B6B;--soft:#F4F5F6;--hair:#DDDDDD;--red:#E63946;--warn:#B4461A;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;color-scheme:light}
html,body{margin:0;overflow-x:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 130px}
header{display:flex;gap:12px;margin-bottom:14px}
header .bar{width:6px;background:var(--red);flex:none}
h1{font-size:34px;line-height:1.05;font-weight:900;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;margin:6px 0 0}
section{border-top:2px solid var(--ink);padding:12px 0 14px;display:grid;gap:10px}
.lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--red)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--ink)}
.seg button{font:inherit;font-size:14px;font-weight:700;padding:10px 2px;border:0;border-left:1px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=text]{font:inherit;font-size:16px;width:100%;border:0;border-bottom:1px solid var(--ink);padding:10px 2px;background:transparent;color:var(--ink);border-radius:0}
input:focus{outline:none;border-bottom:2px solid var(--red)}
.note{font-size:12px;color:var(--mute);margin:0}
.map svg{display:block;width:100%;height:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.map p{font-size:11px;color:var(--mute);margin:4px 0 0;text-align:right}
.tot{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tot b{font-size:34px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tot i{font-style:normal;font-size:12px;color:var(--mute);flex-basis:100%}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:26px 34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--ink);background:var(--bg);touch-action:none}
.it:first-child{border-top:0}
.it .h{font-size:22px;color:#9AA1AA;text-align:center;cursor:grab;user-select:none;-webkit-user-select:none}
.it .n{font-size:19px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.it .n.pm{color:var(--red)}
.it b{display:block;font-size:15px}
.it small{display:block;font-size:12px;color:var(--mute)}
.it .l{font-size:12px;color:#4C535C;text-align:right;line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
.it.lock{opacity:.6}.it.lock .h{visibility:hidden}
.it.st{background:var(--soft)}
.ghost{opacity:.3}
.warn{font-size:13px;color:var(--warn);font-weight:700}
.go{display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);padding:12px 14px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock button{display:flex;justify-content:space-between;width:100%;max-width:560px;margin:0 auto;font:inherit;font-weight:700;font-size:17px;padding:15px 16px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;border-radius:0}
.dock button span{color:var(--red)}
.dock button:disabled{opacity:.45}
.dock p{max-width:560px;margin:6px auto 0;font-size:12.5px;text-align:center;min-height:18px}
.seg button:focus-visible,.dock button:focus-visible,.go:focus-visible{outline:3px solid #FFC400;outline-offset:2px}
#msg{padding:40px 0;font-size:16px}
.draw{stroke-dasharray:1;animation:dash 1s cubic-bezier(.65,0,.35,1) both}
@keyframes dash{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.in{animation:up .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body>
<div class="wrap" id="app"><p id="msg">載入中…</p></div>
<div class="dock" id="dock" hidden><button id="save" disabled>存好了<span>→</span></button><p id="st" aria-live="polite"></p></div>

<script src="twmap.js?v=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbycLQO2yrDYoKEl0DwIC07-Ll8nuLCxrIUhawIrBH1aWbIyislfe9VsonWBW8zYbdudSA/exec';
var TK = new URLSearchParams(location.search).get('tk') || '';
var D = null, START = '', HOME = '', SEQ = 0;      // START：tc／nt／home／gps:緯,經
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function api(body) {   // text/plain：application/json 會觸發預檢，Apps Script 接不住
  body.tk = TK;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j || j.ok === false) throw new Error(j && j.err ? String(j.err).replace(/^Error:\s*/, '') : '伺服器沒有回應'); return j; });
}
function fail(e) { $('app').innerHTML = '<p id="msg">' + esc(e && e.message || e) + '</p>'; $('dock').hidden = true; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function town(a) { return (/[市縣](.{1,4}?[區鄉鎮市])/.exec(String(a || '').replace(/臺/g, '台')) || [])[1] || ''; }

/* 地圖上的位置：地址 → 「縣市＋鄉鎮」的中心點（跟 App rtKey_ 同一個規則）；現在位置用經緯度換算 */
var M = window.TWMAP;
function pos(a) {
  var g = /^(-?[\d.]+),(-?[\d.]+)$/.exec(a || '');
  if (g) return [(+g[2] - 120) * 111.32 * Math.cos(+g[1] * Math.PI / 180), -(+g[1] - 23.5) * 110.57];
  var m = /^(.{2,3}[市縣])(.{1,4}?[區鄉鎮市])/.exec(String(a || '').replace(/臺/g, '台'));
  return (m && M && M.p[m[1] + m[2]]) || null;
}

api({ api: 'rtLoad' }).then(function (d) { D = d; START = d.start.k === 'gps' ? 'gps:' + d.start.a : d.start.k; HOME = d.home; init(); }).catch(fail);

function init() {
  var dd = new Date(D.day + 'T12:00:00+08:00');
  var opts = [[D.office, D.offices[D.office].n], [D.office === 'tc' ? 'nt' : 'tc', D.offices[D.office === 'tc' ? 'nt' : 'tc'].n], ['home', '家'], ['gps', '現在位置']];
  $('app').innerHTML = '<header><div class="bar"></div><div><h1>路線</h1><p class="sub">' + esc(D.name) + '　' + (dd.getMonth() + 1) + '/' + dd.getDate() +
      '（' + '日一二三四五六'.charAt(dd.getDay()) + '）・按住 ≡ 上下拖</p></div></header>' +
    '<section><span class="lab">從哪裡出發</span><div class="seg" id="seg">' +
      opts.map(function (o) { return '<button type="button" data-k="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +
      '<input type="text" id="home" placeholder="家裡地址，例如 台中市北屯區…" hidden value="' + esc(HOME) + '">' +
      '<p class="note" id="fnote"></p></section>' +
    '<section class="map"><svg id="map" role="img" aria-label="路線地圖"></svg><p>點在鄉鎮中心，不是門牌</p></section>' +
    '<section><div class="tot" id="tot"></div><div class="list" id="list"></div><div class="warn" id="warn"></div>' +
      '<a class="go" id="go" target="_blank" rel="noopener" hidden>用 Google 地圖導整條<span>↗</span></a></section>';
  $('dock').hidden = !D.stops.length;
  if (!D.stops.length) { $('list').innerHTML = '<p class="note">這一天沒有還沒做的行程。</p>'; }
  buildList(); paint(true); legsText();
  $('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k === 'gps') {
      if (!navigator.geolocation) return note('這支手機沒辦法取得位置。');
      note('正在取得位置…（手機會問要不要允許）');
      navigator.geolocation.getCurrentPosition(function (p) {
        START = 'gps:' + p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5); changed();
      }, function () { note('沒拿到位置。可以到手機設定允許 LINE 使用位置，或改選別的。'); }, { timeout: 10000 });
      return;
    }
    START = b.dataset.k;
    if (START === 'home' && !HOME) { segPaint(); $('home').focus(); return note('先打家裡地址，打完按鍵盤的「完成」。'); }
    changed();
  });
  $('home').addEventListener('change', function () { HOME = this.value.trim(); if (START === 'home' && HOME) changed(); });
  $('save').addEventListener('click', save);
}
function note(t) { $('fnote').textContent = t; }
function segPaint() {
  var k = START.indexOf('gps:') === 0 ? 'gps' : START;
  [].forEach.call($('seg').children, function (b) { b.setAttribute('aria-pressed', b.dataset.k === k); });
  $('home').hidden = k !== 'home';
}
/* 起點：畫面上的名字與地址（地址只拿來畫地圖） */
function startNow() {
  if (START.indexOf('gps:') === 0) return { n: '現在位置', a: START.slice(4) };
  if (START === 'home') return { n: '家', a: HOME };
  return { n: D.offices[START].n, a: D.offices[START].a };
}

function buildList() {
  $('list').innerHTML = '<div class="it lock st" id="srow"></div>' + D.stops.map(function (s, i) {
    return '<div class="it in" style="--i:' + (i + 1) + '" data-id="' + esc(s.id) + '"><span class="h" aria-label="按住拖曳">≡</span><span class="n' + (s.z === '下午' ? ' pm' : '') + '"></span>' +
      '<span><b>' + esc((s.slot ? s.slot + '　' : '') + s.c) + '</b><small>' + esc([town(s.a), s.topic].filter(String).join('・') || (s.a ? '' : '沒有地址，地圖上不會畫')) + '</small></span><span class="l"></span></div>'; }).join('') +
    D.done.map(function (s) { return '<div class="it lock"><span class="h">≡</span><span class="n">✓</span><span><b>' + esc(s.c) + '</b><small>完成，固定在最後</small></span><span></span></div>'; }).join('');
  if (window.Sortable && D.stops.length > 1) Sortable.create($('list'), { handle: '.h', draggable: '.it[data-id]', ghostClass: 'ghost', animation: 260, easing: 'cubic-bezier(.2,.8,.2,1)',
    onEnd: function () {
      var by = {}; D.stops.forEach(function (s) { by[s.id] = s; });
      D.stops = [].map.call($('list').querySelectorAll('.it[data-id]'), function (el) { return by[el.dataset.id]; });
      changed();
    } });
}
/* 順序或起點一動：地圖、編號馬上變；分鐘公里問 Google（半秒內再動就只問最後一次） */
function changed() {
  D.stops.forEach(function (s) { s.l = undefined; });
  paint(true); legsText(); $('save').disabled = false; $('st').textContent = '';
  var my = ++SEQ;
  clearTimeout(changed.t);
  changed.t = setTimeout(function () {
    api({ api: 'rtLegs', ids: D.stops.map(function (s) { return s.id; }), start: START, home: HOME }).then(function (d) {
      if (my !== SEQ) return;
      var l = {}; d.stops.forEach(function (s) { l[s.id] = s.l; });
      D.stops.forEach(function (s) { s.l = l[s.id] || null; });
      legsText();
    }).catch(function (e) { if (my === SEQ) { D.stops.forEach(function (s) { s.l = null; }); legsText(); $('st').textContent = e.message; } });
  }, 500);
}
function legsText() {
  var st = startNow(), M0 = 0, K0 = 0, wait = false, miss = 0, pm = false, warn = false;
  $('srow').innerHTML = '<span class="h"></span><span class="n">⌂</span><span><b>' + esc(st.n) + '</b><small>' +
    esc(START.indexOf('gps:') === 0 ? '手機的位置' : town(st.a) || st.a) + '・出發點，上面可以改</small></span><span></span>';
  [].forEach.call($('list').querySelectorAll('.it[data-id]'), function (el, i) {
    var s = D.stops[i];
    el.querySelector('.n').textContent = pad(i + 1);
    el.querySelector('.l').innerHTML = s.l === undefined ? '…' : s.l ? s.l.m + ' 分<br>' + s.l.k + ' km' : '—';
    if (s.l === undefined) wait = true; else if (s.l) { M0 += s.l.m; K0 += s.l.k; } else miss++;
    if (s.z === '下午') pm = true; else if (s.z === '上午' && pm) warn = true;
  });
  if (D.stops.length) $('tot').innerHTML = wait ? '<b>…</b><i>正在問 Google 開車要多久</i>'
    : '<b>' + M0 + '</b>分<b>' + Math.round(K0) + '</b>公里<i>開車，Google 算的' + (miss ? '（' + miss + ' 站沒有地址或找不到，沒算進去）' : '') + '</i>';
  $('warn').textContent = warn ? '下午的排到上午前面了（可以存，只是提醒）' : '';
  var a = D.stops.map(function (s) { return s.a; }).filter(String).slice(0, 10);
  $('go').hidden = !a.length;
  if (a.length) $('go').href = 'https://www.google.com/maps/dir/?api=1&travelmode=driving' + (START.indexOf('gps:') === 0 ? '' : '&origin=' + encodeURIComponent(st.a)) +
    '&destination=' + encodeURIComponent(a[a.length - 1]) + (a.length > 1 ? '&waypoints=' + a.slice(0, -1).map(encodeURIComponent).join('%7C') : '');
  segPaint();
  note(START === 'home' ? '地址只存在你自己的帳號，別人看不到。只管這一天。' : START.indexOf('gps:') === 0 ? '從你現在的位置算。只管這一天。' : '只管這一天，明天打開又回到' + D.offices[D.office].n + '。');
}

function paint(anim) {
  var svg = $('map'), st = startNow(), sp = pos(st.a);
  var pts = D.stops.map(function (s) { return pos(s.a); }), dn = D.done.map(function (s) { return pos(s.a); });
  var all = [sp].concat(pts, dn).filter(Boolean);
  if (!M || !all.length) { svg.setAttribute('viewBox', '0 0 100 40'); svg.innerHTML = '<text x="50" y="22" text-anchor="middle" font-size="5" fill="#6B6B6B">' + (M ? '這幾站都沒有地址' : '地圖沒載到') + '</text>'; return; }
  var xs = all.map(function (p) { return p[0]; }), ys = all.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(0, xs) - 6, x1 = Math.max.apply(0, xs) + 12, y0 = Math.min.apply(0, ys) - 6, y1 = Math.max.apply(0, ys) + 6;
  var w = Math.max(x1 - x0, 20), h = Math.max(y1 - y0, w * 0.62); y0 -= (h - (y1 - y0)) / 2;
  svg.setAttribute('viewBox', x0 + ' ' + y0 + ' ' + w + ' ' + h);
  var u = w / 100, r = 2.8 * u, fs = 2.9 * u, g = '';
  Object.keys(M.t).forEach(function (k) { var c = M.p[k]; if (c && c[0] > x0 - 15 && c[0] < x0 + w + 15 && c[1] > y0 - 15 && c[1] < y0 + h + 15) g += '<path d="' + M.t[k] + '" fill="#fff" stroke="#D5D8DC" stroke-width="' + 0.3 * u + '"/>'; });
  Object.keys(M.c).forEach(function (k) { g += '<path d="' + M.c[k] + '" fill="none" stroke="#111" stroke-width="' + 0.5 * u + '"/>'; });
  var line = [sp].concat(pts).filter(Boolean);
  if (line.length > 1) g += '<polyline pathLength="1" class="' + (anim ? 'draw' : '') + '" points="' + line.map(function (p) { return p.join(','); }).join(' ') + '" fill="none" stroke="#E63946" stroke-width="' + u + '" stroke-linejoin="round" stroke-linecap="round"/>';
  function mark(p, fill, txt, label) {
    return '<rect x="' + (p[0] - r) + '" y="' + (p[1] - r) + '" width="' + 2 * r + '" height="' + 2 * r + '" fill="' + fill + '"/>' +
      '<text x="' + p[0] + '" y="' + (p[1] + fs * 0.36) + '" font-size="' + fs + '" text-anchor="middle" fill="#fff" font-weight="800">' + txt + '</text>' +
      (label ? '<text x="' + (p[0] + r * 1.35) + '" y="' + (p[1] + fs * 0.35) + '" font-size="' + fs * 0.85 + '" fill="#111" font-weight="700">' + esc(label) + '</text>' : '');
  }
  dn.forEach(function (p) { if (p) g += mark(p, '#9AA1AA', '✓'); });
  if (sp) g += mark(sp, '#111', '⌂', st.n);
  pts.forEach(function (p, i) { if (p) g += mark(p, D.stops[i].z === '下午' ? '#E63946' : '#111', i + 1, D.stops[i].c); });
  svg.innerHTML = g;
}

function save() {
  var b = $('save'); b.disabled = true; $('st').textContent = '存檔中…';
  api({ api: 'rtSave', ids: D.stops.map(function (s) { return s.id; }), start: START, home: HOME }).then(function (d) {
    HOME = d.home;
    $('st').textContent = '存好了，特助那邊也看得到。回小羽再按一次「今天行程」就是新的。';
  }).catch(function (e) { b.disabled = false; $('st').textContent = e.message; });
}
</script>
</body></html>
